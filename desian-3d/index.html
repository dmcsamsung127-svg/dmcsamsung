<title>데시앙 호실 3D 개념도</title>

<style>
  :root {

    --ink: #1c2229;

    --sheet: #ffffff;

  }

      --ink: #e8ece9;
      --muted: #9aa4a8;
      --line: #2c3438;
      --accent: #5fbfb3;
      --accent-soft: #1e3532;
      --brass: #d9a95c;
      --brass-soft: #3a2f1f;
      --chip-bg: #1d2427;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;

  }

  header.top { display: grid; gap: 10px; }

  .card { display: grid; gap: 8px; }
  .finder { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 14px; color: var(--muted); }
  .finder input, .finder select { font: inherit; color: var(--ink); background: var(--chip-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

<div class="wrap">
  <header class="top">
    <h1>DMC 플렉스 데시앙 · 호실 3D 개념도</h1>
    <p>네이버 등록용으로 글씨 없이 도면과 치수만 담은 개념도입니다. 카드 위 호실 표기와 아래 치수·수정 날짜는 확인용이며 이미지에는 들어가지 않습니다. 치수는 9블럭 세부도면의 기둥 그리드 기준(벽두께 0.2m 차감)입니다.</p>

<script>
/* ───────── 호실 데이터 (매물장 · 임대가능호실 시트 기준, 2026-09-24) ─────────
   sink / blind : true 있음, false 없음, null 정보 없음(그리지 않음)
   corner       : [주 창 방향, 측면 창 방향]
   rooms        : 두 호실 연속 도면 (w·d 실측값이 있으면 그대로 사용)             */
const UNITS = [
  { id: "KB805", w: 4.2, d: 8.2,  area: 11.18, dir: "서향", sink: false, blind: false },
  { id: "KB806", w: 5.38, d: 8.2,  area: 14.23, dir: "서향", sink: false, blind: false },

  { id: "KB608", w: 5.22, d: 8.2,  area: 13.72, dir: "서향", sink: false, blind: false },
  { id: "KB1814", w: 5.22, d: 10.6, area: 18.62, dir: "동향", sink: true,  blind: null },
  { id: "KA604", w: 5.18, d: 10.6,  area: 18.62, dir: "동향", sink: null,  blind: null },
  { id: "KA605", w: 5.22, d: 10.6,  area: 18.62, dir: "동향", sink: null,  blind: null },
  { id: "KA611", w: 3.83, d: 10.6,  area: 14.21, dir: "남향", sink: null,  blind: null, terrace: true,
    note: "단독 테라스" },
  { id: "FB232", w: 5.18, d: 9.45, height: 3.0,  area: 16.38, dir: null,   sink: null,  blind: null, drive: true },
  { id: "FB204", w: 10.6, d: 5.2, height: 3.0,  area: 17.64, dir: null,   sink: null,  blind: null, drive: true },
  { id: "KB1226", w: 5.18, d: 10.6, area: 18.62, dir: "동향", sink: true,  blind: true,
    note: "연계 호실 가능" },
  { id: "F441", w: 4.0, d: 8.2,   area: 10.67, dir: "남향", sink: null,  blind: null, drive: true },
  { id: "F326", w: 5.22, d: 9.89,   area: 16.5,  dir: "동향", sink: null,  blind: null, drive: true },
  { id: "F532", w: 5.18, d: 10.6,   area: 18.79, dir: "동향", sink: null,  blind: null, drive: true },
  { id: "KA911", w: 5.69, d: 10.6,  area: 20.94, dir: "남동향 코너", corner: ["남", "동"], sink: true, blind: null, curtain: true,
    sinkLabel: "대리석", note: "대리석 싱크대 · 쉬폰 커튼 · 바닥 인테리어 · 에어컨" },
  { id: "KA2002", w: 9.41, d: 8.23, area: 25.11, dir: "서향", corner: ["서", "북"],  sink: null, blind: null },
  { id: "KB1901", w: 8.2, d: 8.4, area: 22.7,  dir: "북서 코너", corner: ["북", "서"], sink: null, blind: null },
  { id: "F228", w: 8.2, d: 9.89,   area: 27.17, dir: "동향",  sink: null, blind: null, drive: true },
  { id: "F427", w: 8.2, d: 9.89,   area: 25.66, dir: "동향",  sink: null, blind: null, drive: true },
  { id: "F419", w: 8.2, d: 9.89,   area: 27.17, dir: "북동 코너", corner: ["북", "동"], sink: null, blind: null, drive: true },
  { id: "F347", w: 8.2, d: 10.6,   area: 29,    dir: "서향",  sink: null, blind: null, drive: true },
  { id: "KB1712-1713", title: "KB1712·1713", area: 31.28, dir: "북동향", corner: ["북", "동"], sink: null, blind: true,
    rooms: [{ id: "KB1712", area: 16.8, w: 4.5, d: 11.21 }, { id: "KB1713", area: 14.48, w: 4.0, d: 11.21 }],
    note: "두 호실 연속 · 가벽 유지(터놓지 않음) · 일괄 임차" },
  { id: "FB102", w: 4.92, d: 13.51, area: 21.64, dir: null, sink: false, blind: false, drive: true, door: 2.10, doorH: 2.12, noPark: true,
    note: "층고 2.94m · 출입문 2.10×2.12m · FB103과 합쳐서 임대 가능" },
  { id: "FB103", w: 5.21, d: 13.52, parkN: 1, area: 22.91, dir: null, sink: false, blind: false, drive: true, door: 2.10, doorH: 2.12,
    note: "층고 2.99m · 출입문 2.10×2.12m · FB102와 합쳐서 임대 가능" },
  { id: "KA1906", w: 10.6, d: 10.6, area: 39.56, dir: "남동향 코너", corner: ["남", "동"], sink: null, blind: null },
  { id: "KB1710", w: 4.0, d: 8.23, area: 10.67, dir: "서향",  sink: null, blind: null },
  { id: "KB1630", w: 4.0, d: 10.6, area: 14.48, dir: "남향",  sink: null, blind: null },
  { id: "FB111", w: 4.3, d: 13.5, height: 3.0,  area: 18.75, dir: null,    sink: null, blind: null, drive: true },
  { id: "KB611", w: 5.22, d: 10.6,  area: 18.62, dir: "동향",  sink: null, blind: null },
  { id: "KB1135", w: 8.2, d: 8.2, area: 25.1, terrace: true,    dir: null,    sink: null, blind: null },
];

const M2_PER_PY = 3.305785;

/* 층별 천장 높이 (사용자 제공): 지하1·2층 3.0M, 1층 F호실 4.0M, 2~5층 3.9M, 6~20층 2.7M */
function floorHeight(id) {
  const m = id.match(/^(KA|KB|FB|F|C)(\d+)/);
  if (m[1] === "FB") return 3.0;
  const fl = parseInt(m[2].slice(0, -2), 10);
  if (fl === 1) return 4.0;
  return fl <= 5 ? 3.9 : 2.7;
}

/* 호실 코드 → 동 · 층 */
function locate(id) {
  const m = id.match(/^(KA|KB|FB|F)(\d+)/);
  const [, pre, num] = m;
  if (pre === "FB") return { dong: "드라이브인", floor: "B" + num[0] + "층" };
  const floor = parseInt(num.slice(0, -2), 10) + "층";
  if (pre === "F") return { dong: "드라이브인", floor };
  return { dong: pre === "KA" ? "A동" : "B동", floor };
}

/* 전용면적 → 개념도용 가로(창측)·세로(깊이) 추정 */
function estimateDims(py, corner) {
  const a = py * M2_PER_PY;
  let ratio = py < 12 ? 2.3 : py < 16 ? 2.0 : py < 20 ? 1.7 : py < 26 ? 1.45 : 1.25;
  if (corner) ratio = Math.max(1.0, ratio * 0.75);
  const w = Math.sqrt(a / ratio);
  return { w, d: a / w };
}

/* ───────── 등각 투상 ───────── */
const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
let FLIPX = 1;   // 반전 저장(mirror) 호실은 화면 좌우를 되돌려 도면과 같은 방향으로 보이게(반대편 대각선에서 본 모습)
let SLK = 0, SLD = 1;   // 사선 뒷벽: 뒤(y=0)가 x에 따라 SLK·x 만큼 앞으로(앞벽 y=D는 그대로)
const slantY = (x, y) => SLK ? y + SLK * x * (SLD - y) / SLD : y;
const proj = ([x, y, z]) => { const yy = slantY(x, y); return [FLIPX * (x - yy) * C30, (x + yy) * S30 - z]; };

const COL = {
  floor: "#e7e3db", tile: "#d8d3c9",
  wallX: "#e9e6e0", wallY: "#f6f4f0", wallTop: "#b9b3a8", wallEnd: "#d3cec5", edge: "#8d887f",
  cut: "#4a4f55", cutFace: "#d9d5ce",
  glass: "#bcd6e2", glassEdge: "#6f95a8",
  blind: "#efe5d2", blindLine: "#cdb994",
  curtain: "#ffffff", curtainLine: "#d8d4cc",
  cabinet: "#fbfbfa", cabinetSide: "#ecebe7", counter: "#a7adb2", counterTop: "#c3c8cc", basin: "#8e959b",
  marble: "#ebe8e3", marbleTop: "#f4f2ee",
  leaf: "#c9a57e", door: "#5f6f7c",
  deck: "#c9a57a", plank: "#ad885b", rail: "#6b6f73",
  dim: "#0f5c55", tagBg: "#0f5c55", tagInk: "#ffffff",
};

function renderUnit(u, st) {
  FLIPX = u.mirror ? -1 : 1;
  SLK = 0; SLD = 1;
  const VW = 1000, VH = 720;
  const H = floorHeight(u.id);
  const T = 0.20;            // 벽 두께 20cm (사용자 제공)
  const HC = 0.22;           // 전면 절단벽 높이
  const rooms = (u.rooms || [{ id: u.id, area: u.area, w: u.w, d: u.d }]).map(r => {
    const fbDepth = { "2": 9.5, "1": 13.5 }[u.id.startsWith("FB") ? u.id[2] : ""];
    const dm = r.w ? { w: r.w, d: r.d }
      : fbDepth ? { w: (r.area * M2_PER_PY) / fbDepth, d: fbDepth }
      : estimateDims(r.area, u.corner);
    return { ...r, ...dm };
  });
  let ox = 0;
  rooms.forEach(r => { r.ox = ox; ox += r.w; });
  const W = ox, D = Math.max(...rooms.map(r => r.d));
  if (u.slant && rooms.length === 1) { SLD = D; SLK = (u.slant[0] - u.slant[1]) / W; }   // slant=[x=0 쪽 깊이, x=W 쪽 깊이] (도면 실측)
  const hasWin = !u.id.startsWith("FB") && !u.noWin;   // 지하(FB)·1층 내부형 호실은 창 없음
  const isC = /^C\d/.test(u.id);
  const upperH = /^C5\d\d$/.test(u.id) ? 2.7 : 0;   // C5xx 복층 위층 높이          // C호실: 정원형 통유리(현장 사진 기준)
  const win = { sill: isC ? 0.05 : 0.12, head: H - (isC ? 0.15 : 0.3) };

  const ops = [];
  const poly = (pts, s) => ops.push({ t: "poly", pts, ...s });
  const path = (rings, s) => ops.push({ t: "path", rings, ...s });
  const line = (pts, s) => ops.push({ t: "line", pts, ...s });
  const ftext = (x, y, z, str, size, s) => { if (!st.clean) ops.push({ t: "ftext", at: [x, y, z], str, size, ...s }); };
  const tag = (p, str) => { if (!st.clean) ops.push({ t: "tag", at: p, str }); };

  // 박스: 보이는 면(+y, +x, 윗면)만 그림
  function box(x0, x1, y0, y1, z0, z1, c) {
    poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], { fill: c.fy, stroke: c.edge || COL.edge });
    poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], { fill: c.fx, stroke: c.edge || COL.edge });
    poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], { fill: c.top, stroke: c.edge || COL.edge });
  }
  const rectY = (x0, x1, z0, z1, y = 0) => [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]];
  const rectX = (y0, y1, z0, z1, x = 0) => [[x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1]];

  /* 1. 바닥 + 타일 + 호실 표기 */
  const CH = rooms.length === 1 && u.chamfer ? u.chamfer : null;   // [뒷벽 쪽 길이, 왼벽 쪽 길이] 사선으로 잘린 뒤-왼쪽 모서리
  const yStart = x => CH && x < CH[0] ? CH[1] * (1 - x / CH[0]) : 0;
  const xStart = y => CH && y < CH[1] ? CH[0] * (1 - y / CH[1]) : 0;
  rooms.forEach((r, i) => {
    poly(CH ? [[CH[0], 0, 0], [r.w, 0, 0], [r.w, r.d, 0], [0, r.d, 0], [0, CH[1], 0]]
            : [[r.ox, 0, 0], [r.ox + r.w, 0, 0], [r.ox + r.w, r.d, 0], [r.ox, r.d, 0]], { fill: COL.floor, stroke: COL.edge });
    const g = 0.6;
    for (let x = r.ox + g; x < r.ox + r.w - 0.05; x += g) line([[x, yStart(x), 0], [x, r.d, 0]], { stroke: COL.tile, sw: 0.8 });
    for (let y = g; y < r.d - 0.05; y += g) line([[r.ox + xStart(y), y, 0], [r.ox + r.w, y, 0]], { stroke: COL.tile, sw: 0.8 });
    const size = Math.min(0.9, r.w * 0.19, r.d * 0.14);
    if (i < rooms.length - 1) {
      // 오른쪽 가벽 뒤로 가려지지 않게 깊이 방향으로 눕혀 표기
      const fx = r.ox + size * 0.6;
      if (!st.clean) ops.push({ t: "ftextY", at: [fx, r.d * 0.5, 0], str: r.id, size, fill: "#6f6a60", weight: 800 });
      if (!st.clean) ops.push({ t: "ftextY", at: [fx + size * 0.95, r.d * 0.5, 0], str: `${r.area}평`, size: size * 0.62, fill: "#7d786e", weight: 700 });
    } else {
      const cx = r.ox + r.w / 2, cy = r.d * 0.5;
      ftext(cx, cy, 0, r.id, size, { fill: "#6f6a60", weight: 800 });
      ftext(cx, cy + size * 1.05, 0, `${r.area}평`, size * 0.62, { fill: "#7d786e", weight: 700 });
    }
  });

  /* 2. 테라스 (창 밖) */
  if (u.terrace) {
    const td = u.terrD || 2.4, t0 = -T - (st.balcony && hasWin ? (u.balD || 1.5) + T : 0);   // 발코니가 있으면 그 바깥
    const td0 = u.terrD0 || td, tdW = u.terrDW || td, ryAt = x => t0 - (td0 + (tdW - td0) * x / W);   // 사선 테라스(도면 실측 양끝 깊이)
    poly([[0, t0, 0], [W, t0, 0], [W, ryAt(W), 0], [0, ryAt(0), 0]], { fill: COL.deck, stroke: COL.plank });
    for (let x = 0.3; x < W; x += 0.3) line([[x, t0, 0], [x, ryAt(x), 0]], { stroke: COL.plank, sw: 0.8 });
    for (let x = 0; x <= W + 0.01; x += W / Math.ceil(W / 1.2)) line([[x, ryAt(x), 0], [x, ryAt(x), 1.1]], { stroke: COL.rail, sw: 1.6 });
    line([[0, ryAt(0), 1.1], [W, ryAt(W), 1.1]], { stroke: COL.rail, sw: 2.2 });
    line([[W, ryAt(W), 1.1], [W, t0, 1.1]], { stroke: COL.rail, sw: 2.2 });
    line([[W, t0, 0], [W, t0, 1.1]], { stroke: COL.rail, sw: 1.6 });
    tag([W, -T - td * 0.6, 1.5], "단독 테라스");
  }

  /* 2-1. 발코니 — 외부 유리 커튼월로 막힌 실내형(서비스) 발코니 */
  const BD = u.balD || 1.5, BY = -T - BD, XB = -T - (u.sideD || BD);   // 베란다 깊이(도면 실측값: 뒤 balD, 옆 sideD)
  if (u.terrL && st.balcony && hasWin) {   // 옆(왼쪽) 테라스 — 옆 베란다 바깥(도면 실측 깊이)
    const x1 = XB - T, x0 = x1 - u.terrL, ya = u.sideBal ? -T : BY - T;
    poly([[x0, ya, 0], [x1, ya, 0], [x1, D + T, 0], [x0, D + T, 0]], { fill: COL.deck, stroke: COL.plank });
    for (let y = ya + 0.3; y < D + T; y += 0.3) line([[x0, y, 0], [x1, y, 0]], { stroke: COL.plank, sw: 0.8 });
    const n = Math.ceil((D + T - ya) / 1.2);
    for (let k = 0; k <= n; k++) { const y = ya + (D + T - ya) * k / n; line([[x0, y, 0], [x0, y, 1.1]], { stroke: COL.rail, sw: 1.6 }); }
    line([[x0, ya, 1.1], [x0, D + T, 1.1]], { stroke: COL.rail, sw: 2.2 });
    line([[x0, D + T, 1.1], [x1, D + T, 1.1]], { stroke: COL.rail, sw: 2.2 });
    line([[x0, ya, 1.1], [x1, ya, 1.1]], { stroke: COL.rail, sw: 2.2 });
  }
  if (st.balcony && hasWin && u.sideBal && u.openBal) {   // C6: 끝벽 밖 개방형 발코니(데크 + 난간, 현장 사진)
    box(XB, -T, -T, D, -0.12, 0, { fy: "#b98e63", fx: "#a67b52", top: COL.deck });
    for (let y = 0.15; y < D; y += 0.3) line([[XB, y, 0.002], [-T, y, 0.002]], { stroke: COL.plank, sw: 0.8 });
    const n = Math.max(3, Math.round((D + T) / 0.5));
    for (let k = 0; k <= n; k++) { const y = -T + (D + T) * k / n; line([[XB, y, 0], [XB, y, 1.1]], { stroke: "#2b2f34", sw: 1.4 }); }
    line([[XB, -T, 1.1], [XB, D, 1.1]], { stroke: "#2b2f34", sw: 2.4 });
    [[-T, -T], [D, D]].forEach(([y]) => { line([[XB, y, 0], [XB, y, 1.1]], { stroke: "#2b2f34", sw: 2 }); line([[XB, y, 1.1], [-T, y, 1.1]], { stroke: "#2b2f34", sw: 2.2 }); });
  } else if (st.balcony && hasWin && u.sideBal) {   // 발코니가 측면(x=0)에만 있는 호실(뒷벽은 막힘)
    box(XB, -T, -T, D, -0.12, 0, { fy: "#cfcbc4", fx: "#c2bdb5", top: "#dcdde0" });
    for (let y = 0.6; y < D; y += 0.6) line([[XB, y, 0.002], [-T, y, 0.002]], { stroke: "#c9cacd", sw: 0.8 });
    box(XB - T, -T, -T * 2, -T, 0, H, { fy: COL.wallEnd, fx: COL.wallX, top: COL.wallTop });
    poly(rectX(-T, D, 0, H, XB), { fill: "#c7dde8", op: 0.6, stroke: "#6f8a98", sw: 1.4 });
    const m = Math.max(2, Math.round((D + T) / 0.9));
    for (let k = 1; k < m; k++) { const y = -T + (D + T) * k / m; line([[XB, y, 0], [XB, y, H]], { stroke: "#6f8a98", sw: 1.2 }); }
    line([[XB, -T, 1.1], [XB, D, 1.1]], { stroke: "#6f8a98", sw: 1.2 });
    box(XB - T, XB, -T * 2, D, H - 0.001, H, { fy: COL.wallTop, fx: COL.wallTop, top: COL.wallTop });
    box(XB - T, -T, D, D + T, 0, H, { fy: COL.wallEnd, fx: COL.wallEnd, top: COL.wallTop });
  } else if (st.balcony && hasWin) {
    const corner = !!u.corner;          // 코너 호실: 발코니가 두 면을 ㄱ자로 감쌈
    const x0 = corner ? XB : 0;
    if (corner) {
      box(XB, -T, -T, D, -0.12, 0, { fy: "#cfcbc4", fx: "#c2bdb5", top: "#dcdde0" });
      for (let y = 0.6; y < D; y += 0.6) line([[XB, y, 0.002], [-T, y, 0.002]], { stroke: "#c9cacd", sw: 0.8 });
      poly(rectX(BY, D, 0, H, XB), { fill: "#c7dde8", op: 0.6, stroke: "#6f8a98", sw: 1.4 });
      const m = Math.max(2, Math.round((D - BY) / 0.9));
      for (let k = 1; k < m; k++) { const y = BY + (D - BY) * k / m; line([[XB, y, 0], [XB, y, H]], { stroke: "#6f8a98", sw: 1.2 }); }
      line([[XB, BY, 1.1], [XB, D, 1.1]], { stroke: "#6f8a98", sw: 1.2 });
      box(XB - T, XB, BY - T, D, H - 0.001, H, { fy: COL.wallTop, fx: COL.wallTop, top: COL.wallTop });
      box(XB - T, -T, D, D + T, 0, H, { fy: COL.wallEnd, fx: COL.wallEnd, top: COL.wallTop });
    }
    box(x0, W, BY, -T, -0.12, 0, { fy: "#cfcbc4", fx: "#c2bdb5", top: "#dcdde0" });
    for (let x = 0.6; x < W; x += 0.6) line([[x, -T, 0.002], [x, BY, 0.002]], { stroke: "#c9cacd", sw: 0.8 });
    for (let y = -T - 0.6; y > BY; y -= 0.6) line([[0, y, 0.002], [W, y, 0.002]], { stroke: "#c9cacd", sw: 0.8 });
    // 외부 커튼월(바닥~천장 유리)
    poly(rectY(x0, W, 0, H, BY), { fill: "#c7dde8", op: 0.6, stroke: "#6f8a98", sw: 1.4 });
    const n = Math.max(2, Math.round((W - x0) / 0.9));
    for (let k = 1; k < n; k++) { const x = x0 + (W - x0) * k / n; line([[x, BY, 0], [x, BY, H]], { stroke: "#6f8a98", sw: 1.2 }); }
    line([[x0, BY, 1.1], [W, BY, 1.1]], { stroke: "#6f8a98", sw: 1.2 });
    // 양옆 벽
    if (!corner) box(-T, 0, BY - T, -T, 0, H, { fy: COL.wallEnd, fx: COL.wallX, top: COL.wallTop });
    box(x0 - (corner ? T : 0), W, BY - T, BY, H - 0.001, H, { fy: COL.wallTop, fx: COL.wallTop, top: COL.wallTop });
    box(W, W + T, BY - T, -T, 0, H, { fy: COL.wallEnd, fx: COL.wallEnd, top: COL.wallTop });
  }

  /* 창 · 블라인드 · 커튼 */
  function windowOnY(x0, x1) {           // y=0 벽(주 창)
    poly(rectY(x0, x1, win.sill, win.head, 0), { fill: COL.glass, op: 0.5, stroke: COL.glassEdge, sw: 1.4 });
    const n = Math.max(1, Math.round((x1 - x0) / 1.2));
    for (let i = 1; i < n; i++) {
      const x = x0 + (x1 - x0) * i / n;
      line([[x, 0, win.sill], [x, 0, win.head]], { stroke: COL.glassEdge, sw: 1.4 });
    }
    line([[x0, 0, win.sill + 0.5], [x1, 0, win.sill + 0.5]], { stroke: COL.glassEdge, sw: 1 });
    if (st.blind) blinds((zz) => [[x0, 0.01, zz], [x1, 0.01, zz]], (za, zb) => rectY(x0, x1, za, zb, 0.01));
    if (st.curtain) curtains((a, za, zb) => rectY(x0 + a[0] * (x1 - x0), x0 + a[1] * (x1 - x0), za, zb, 0.02),
                             (f, za, zb) => [[x0 + f * (x1 - x0), 0.02, za], [x0 + f * (x1 - x0), 0.02, zb]], x1 - x0);
  }
  function windowOnX(y0, y1) {           // x=0 벽(코너 측창)
    poly(rectX(y0, y1, win.sill, win.head, 0), { fill: COL.glass, op: 0.5, stroke: COL.glassEdge, sw: 1.4 });
    const n = Math.max(1, Math.round((y1 - y0) / 1.2));
    for (let i = 1; i < n; i++) {
      const y = y0 + (y1 - y0) * i / n;
      line([[0, y, win.sill], [0, y, win.head]], { stroke: COL.glassEdge, sw: 1.4 });
    }
    line([[0, y0, win.sill + 0.5], [0, y1, win.sill + 0.5]], { stroke: COL.glassEdge, sw: 1 });
    if (st.blind) blinds((zz) => [[0.01, y0, zz], [0.01, y1, zz]], (za, zb) => rectX(y0, y1, za, zb, 0.01));
    if (st.curtain) curtains((a, za, zb) => rectX(y0 + a[0] * (y1 - y0), y0 + a[1] * (y1 - y0), za, zb, 0.02),
                             (f, za, zb) => [[0.02, y0 + f * (y1 - y0), za], [0.02, y0 + f * (y1 - y0), zb]], y1 - y0);
  }
  function blinds(seg, rect) {
    const zb = win.head - (win.head - win.sill) * 0.55;
    poly(rect(zb, win.head), { fill: COL.blind, op: 0.93, stroke: COL.blindLine, sw: 1 });
    for (let z = win.head - 0.07; z > zb + 0.02; z -= 0.07) line(seg(z), { stroke: COL.blindLine, sw: 0.7 });
    line(seg(zb), { stroke: "#a8926a", sw: 2 });
    line(seg(win.head + 0.04), { stroke: "#a8926a", sw: 3 });
  }
  function curtains(rect, vline, len) {
    const pw = Math.min(0.18, 0.8 / len);
    [[0, pw], [1 - pw, 1]].forEach(a => {
      poly(rect(a, win.sill + 0.02, win.head), { fill: COL.curtain, op: 0.78, stroke: COL.curtainLine, sw: 1 });
      for (let k = 1; k < 5; k++) line(vline(a[0] + (a[1] - a[0]) * k / 5, win.sill + 0.02, win.head), { stroke: COL.curtainLine, sw: 0.8 });
    });
    const zr = win.head + 0.05;
    line([vline(0, zr, zr)[0], vline(1, zr, zr)[0]], { stroke: "#9b968c", sw: 2 });
  }

  /* 3. 뒷벽: x=0(좌) — 코너면 측창 */
  const sideWin = u.openBal ? [0.1, D - 0.1] : u.corner || u.sideBal ? [st.clean ? 0.7 : 0.25, Math.max(1.5, D - 1.6)] : null;   // C6: 끝벽 통창   // clean: 모서리 기둥 피함
  const leftFace = rectX(CH ? CH[1] : 0, D, 0, H, 0);
  // 도면에서 읽은 발코니 문(측벽 balLeft: y구간, 뒷벽 balBack: x구간)
  const freeSegs = (lo, hi, cuts) => {
    const out = []; let cur = lo;
    cuts.slice().sort((p, q) => p[0] - q[0]).forEach(([p, q]) => { if (p - cur > 0.6) out.push([cur, p]); cur = Math.max(cur, q); });
    if (hi - cur > 0.6) out.push([cur, hi]);
    return out;
  };
  const glassDoorX = ([a, b]) => {
    poly(rectX(a, b, 0, 2.2, 0), { fill: COL.glass, op: 0.45, stroke: "#5f7582", sw: 2.2 });
    poly(rectX(a + 0.08, b - 0.08, 0.1, 2.12, 0.005), { fill: "none", stroke: "#8aa3b0", sw: 1 });
    line([[0.01, b - 0.14, 0.95], [0.01, b - 0.14, 1.2]], { stroke: "#5b6166", sw: 2.4 });
  };
  const sideSegs = sideWin ? (st.balcony && u.balLeft ? freeSegs(sideWin[0], sideWin[1], u.balLeft.map(([a, b]) => [a - 0.1, b + 0.1])) : [sideWin]) : [];
  const sideRings = [leftFace, ...sideSegs.map(([a, b]) => rectX(a, b, win.sill, win.head, 0))];
  if (st.balcony && u.balLeft && sideWin) u.balLeft.forEach(([a, b]) => sideRings.push(rectX(a, b, 0, 2.2, 0)));
  if (sideRings.length > 1) path(sideRings, { fill: COL.wallX, stroke: COL.edge });
  else poly(leftFace, { fill: COL.wallX, stroke: COL.edge });
  sideSegs.forEach(([a, b]) => windowOnX(a, b));
  if (st.balcony && u.balLeft && sideWin) u.balLeft.forEach(glassDoorX);
  poly([[-T, D, 0], [0, D, 0], [0, D, H], [-T, D, H]], { fill: COL.wallEnd, stroke: COL.edge });
  poly([[-T, CH ? CH[1] : -T, H], [0, CH ? CH[1] : -T, H], [0, D, H], [-T, D, H]], { fill: COL.wallTop, stroke: COL.edge });

  /*    뒷벽: y=0(우) — 주 창 */
  const backRings = [rectY(CH ? CH[0] : 0, W, 0, H, 0)];
  const winSpans = [], balDoors = [];
  // 기둥(층별 아이소 도면 기준): 창측 모서리에 0.6m 각 기둥, 폭 6.5m 이상이면 양쪽 모서리
  const COLW = 0.6;
  const pillars = [];
  rooms.forEach((r, i) => {
    pillars.push(r.ox + (i ? T / 2 : 0));
    if (r.w >= 6.5 || i === rooms.length - 1 && rooms.length > 1) pillars.push(r.ox + r.w - COLW - (i < rooms.length - 1 ? T / 2 : 0));
  });
  const colAt = (x0, x1) => pillars.some(px => px + COLW > x0 && px < x1);
  // 실제 기둥(도면에서 읽은 위치·크기). 있으면 규칙 배치 대신 사용
  const REAL = st.clean && rooms.length === 1;   // 도면 판독 기둥만(없으면 기둥 없음)
  const realCols = REAL ? (u.cols || []).map(([x, y, sx, sy]) => [Math.max(x - sx / 2, -T), Math.min(x + sx / 2, W + T), Math.max(y - sy / 2, -T), Math.min(y + sy / 2, D + T)])
                               .filter(([x0, x1, y0, y1]) => x1 - x0 > 0.05 && y1 - y0 > 0.05) : [];
  const backCols = realCols.filter(c => c[2] < 0.6);   // 창이 있는 안쪽 벽에 붙은 기둥
  if (hasWin && !u.sideBal) rooms.forEach(r => {
    let a, b;
    if (REAL) {
      // 기둥 사이 빈 구간 중 가장 넓은 곳에 창
      const cuts = backCols.map(c => [c[0] - 0.12, c[1] + 0.12]).sort((p, q) => p[0] - q[0]);
      let free = [], cur = (sideWin ? 0.05 : 0.2);
      cuts.forEach(([p, q]) => { if (p > cur) free.push([cur, p]); cur = Math.max(cur, q); });
      if (W - 0.2 > cur) free.push([cur, W - 0.2]);
      [a, b] = free.sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]))[0] || [0.2, W - 0.2];
    } else {
      a = r.ox + (colAt(r.ox, r.ox + 1) ? COLW + 0.15 : (r.ox === 0 && sideWin ? 0.05 : 0.2));
      b = r.ox + r.w - (colAt(r.ox + r.w - 1, r.ox + r.w) ? COLW * 2 + 0.15 : 0.2);   // 등각에서 기둥 앞면이 왼쪽으로 가림
    }
    if (st.balcony && u.balBack) {
      const cuts = [...u.balBack.map(([p, q]) => [p - 0.1, q + 0.1]), ...backCols.map(c => [c[0] - 0.12, c[1] + 0.12])];
      u.balBack.forEach(([p, q]) => { balDoors.push([p, q]); backRings.push(rectY(p, q, 0, 2.2, 0)); });
      freeSegs(sideWin ? 0.05 : 0.2, W - 0.2, cuts).forEach(([p, q]) => { winSpans.push([p, q]); backRings.push(rectY(p, q, win.sill, win.head, 0)); });
      return;
    }
    if (st.balcony && b - a > 2.2) {
      balDoors.push([b - 0.9, b]);
      backRings.push(rectY(b - 0.9, b, 0, 2.2, 0));
      b -= 1.1;
    }
    if (b - a > 0.6) { winSpans.push([a, b]); backRings.push(rectY(a, b, win.sill, win.head, 0)); }
  });
  path(backRings, { fill: COL.wallY, stroke: COL.edge });
  winSpans.forEach(([a, b]) => windowOnY(a, b));
  balDoors.forEach(([a, b]) => {   // 발코니 출입 유리문
    poly(rectY(a, b, 0, 2.2, 0), { fill: COL.glass, op: 0.45, stroke: "#5f7582", sw: 2.2 });
    poly(rectY(a + 0.08, b - 0.08, 0.1, 2.12, 0.005), { fill: "none", stroke: "#8aa3b0", sw: 1 });
    line([[a + 0.14, 0.01, 0.95], [a + 0.14, 0.01, 1.2]], { stroke: "#5b6166", sw: 2.4 });
  });
  if (CH) {   // 사선 벽
    poly([[0, CH[1], 0], [CH[0], 0, 0], [CH[0], 0, H], [0, CH[1], H]], { fill: "#efece6", stroke: COL.edge });
    poly([[-T, CH[1], H], [0, CH[1], H], [CH[0], 0, H], [CH[0], -T, H]], { fill: COL.wallTop, stroke: COL.edge });
  }
  const COLC = { fy: "#d9d4cb", fx: "#e4e0d8", top: "#8f897e" };
  if (REAL) realCols.filter(([x0, x1, y0, y1]) => y1 < D - 0.05 && x1 < W - 0.05)   // 앞·오른쪽 절단벽에 걸친 기둥은 절단 높이로(5단계)
                    .forEach(([x0, x1, y0, y1]) => box(x0, x1, y0, y1, 0, H, COLC));
  else if (st.clean) pillars.filter(px => !CH || px >= CH[0]).forEach(px => box(px, px + COLW, 0, COLW, 0, H, COLC));
  poly([[W, -T, 0], [W, 0, 0], [W, 0, H], [W, -T, H]], { fill: COL.wallEnd, stroke: COL.edge });
  poly([[CH ? CH[0] : -T, -T, H], [W, -T, H], [W, 0, H], [CH ? CH[0] : -T, 0, H]], { fill: COL.wallTop, stroke: COL.edge });

  /* 4. 호실별: 가벽 → 싱크대 → 출입문 */
  const doorW = st.clean ? (u.door || (u.drive ? 2.1 : 1.8)) : u.drive ? (u.door || 2.4) : 0.95;
  const doorH = st.clean ? (u.doorH || 2.1) : u.drive ? (u.doorH || 2.2) : 2.1;
  const doors = [];
  rooms.forEach((r, i) => {
    if (i > 0) {  // 가벽(터놓지 않음) — 반투명
      const x = r.ox;
      poly(rectX(0, D, 0, H, x + T / 2), { fill: "#ffffff", op: 0.42, stroke: "#7f7a72", sw: 1.4 });
      poly([[x - T / 2, 0, H], [x + T / 2, 0, H], [x + T / 2, D, H], [x - T / 2, D, H]], { fill: COL.wallTop, stroke: COL.edge });
      poly([[x - T / 2, D, 0], [x + T / 2, D, 0], [x + T / 2, D, H], [x - T / 2, D, H]], { fill: COL.wallEnd, op: 0.8, stroke: COL.edge });
    }
    if (st.sink && i === 0) sink(r.d, u.sinkLabel === "대리석");
    const xa = st.clean && rooms.length === 1 && u.doorX != null ? Math.min(Math.max(u.doorX - doorW / 2, 0.1), r.w - doorW - 0.1)
             : u.drive || st.clean ? r.ox + (r.w - doorW) / 2 : r.ox + r.w - 0.35 - doorW;
    const xb = xa + doorW;
    if (u.doorSide !== "R") doors.push([xa, xb]);
    if (st.clean) {
      // 양개문은 전면벽 단계에서 그림
    } else if (!u.drive) {
      poly([[xb, r.d - doorW, 0], [xb, r.d, 0], [xb, r.d, doorH], [xb, r.d - doorW, doorH]], { fill: COL.leaf, op: 0.9, stroke: "#8e6c47", sw: 1.2 });
      const arc = [];
      for (let k = 0; k <= 16; k++) { const th = (Math.PI / 2) * k / 16; arc.push([xb - doorW * Math.cos(th), r.d - doorW * Math.sin(th), 0.003]); }
      line(arc, { stroke: COL.door, sw: 1.1, dash: "4 4" });
    } else {
      // 드라이브인 진입 화살표
      const cx = (xa + xb) / 2, y0 = r.d - 0.4, L = Math.min(2.2, r.d * 0.3), hw = 0.45;
      poly([[cx - hw * 0.45, y0, 0.004], [cx + hw * 0.45, y0, 0.004], [cx + hw * 0.45, y0 - L * 0.6, 0.004],
            [cx + hw, y0 - L * 0.6, 0.004], [cx, y0 - L, 0.004], [cx - hw, y0 - L * 0.6, 0.004], [cx - hw * 0.45, y0 - L * 0.6, 0.004]],
           { fill: "#a8752a", op: 0.55, stroke: "none" });
    }
  });

  function sink(d, marble) {
    const L = 1.6, y1 = d - 0.3, y0 = y1 - L;
    const cab = marble ? { fy: COL.cabinetSide, fx: COL.cabinet, top: COL.cabinet } : { fy: COL.cabinetSide, fx: COL.cabinet, top: COL.cabinet };
    poly(rectX(y0, y1, 0.86, 1.5, 0.004), { fill: marble ? "#e9e4dc" : "#dfe6e8", stroke: COL.edge, sw: 0.8 });
    box(0, 0.6, y0, y1, 0.1, 0.84, cab);
    box(0, 0.58, y0 + 0.03, y1 - 0.03, 0, 0.1, { fy: "#6b6f73", fx: "#6b6f73", top: "#6b6f73" });
    for (let k = 1; k < 3; k++) line([[0.6, y0 + L * k / 3, 0.14], [0.6, y0 + L * k / 3, 0.8]], { stroke: COL.edge, sw: 0.8 });
    for (let k = 0; k < 3; k++) line([[0.6, y0 + L * (k + 0.5) / 3 - 0.08, 0.72], [0.6, y0 + L * (k + 0.5) / 3 + 0.08, 0.72]], { stroke: "#6b6f73", sw: 2 });
    box(0, 0.64, y0 - 0.02, y1 + 0.02, 0.84, 0.88, marble
      ? { fy: COL.marble, fx: COL.marble, top: COL.marbleTop }
      : { fy: COL.counter, fx: COL.counter, top: COL.counterTop });
    poly([[0.12, y0 + 0.3, 0.881], [0.5, y0 + 0.3, 0.881], [0.5, y0 + 0.82, 0.881], [0.12, y0 + 0.82, 0.881]], { fill: COL.basin, stroke: "#6b7277", sw: 1 });
    line([[0.07, y0 + 0.56, 0.88], [0.07, y0 + 0.56, 1.14], [0.24, y0 + 0.56, 1.14], [0.24, y0 + 0.56, 1.08]], { stroke: "#5b6166", sw: 2.4 });
    box(0, 0.35, y0, y1, 1.55, 2.25, { fy: COL.cabinetSide, fx: COL.cabinet, top: COL.cabinetSide });
    for (let k = 1; k < 3; k++) line([[0.35, y0 + L * k / 3, 1.58], [0.35, y0 + L * k / 3, 2.22]], { stroke: COL.edge, sw: 0.8 });
  }

  /* 4-1. C5xx 복층: 위층(2.7M, 사용자 제공)은 점선 윤곽 + 나선계단(현장 사진 기준) */
  if (upperH) {
    const z0 = H + 0.2, z1 = H + 0.2 + upperH, G = { stroke: "#8f8a80", sw: 1.3, dash: "7 5" };
    [[[-T, -T], [W, -T]], [[W, -T], [W, D]], [[-T, -T], [-T, D]], [[-T, D], [W, D]]].forEach(([a, b]) => {
      line([[a[0], a[1], z1], [b[0], b[1], z1]], G);
    });
    [[-T, -T], [W, -T], [W, D], [-T, D]].forEach(([x, y]) => line([[x, y, z0], [x, y, z1]], G));
    poly([[-T, -T, z0], [W, -T, z0], [W, D, z0], [-T, D, z0]], { fill: "#ffffff", op: 0.0, stroke: "#8f8a80", sw: 1.3 });
  }
  if (/^C6\d\d$/.test(u.id)) {   // 아래층(C5)과 연결된 계단 개구부 + 난간(현장 사진)
    const sp = u.spiral || [W - 1.1, 1.2], x0 = Math.max(0.1, sp[0] - 0.95), y0 = Math.max(0.1, sp[1] - 0.95), y1 = Math.min(D - 0.1, sp[1] + 0.95), xe = Math.min(W - 0.1, sp[0] + 0.95);
    poly([[x0, y0, 0.003], [xe, y0, 0.003], [xe, y1, 0.003], [x0, y1, 0.003]], { fill: "#5d5650", stroke: "#2b2f34", sw: 1.2 });
    for (let k = 0; k < 6; k++) { const yy = y0 + (y1 - y0) * (k + 0.5) / 6; line([[x0 + 0.1, yy, 0.004], [xe - 0.1, yy, 0.004]], { stroke: "#8a5a3c", sw: 2 }); }
    const rail = [[x0, y1, 1.0], [x0, y0, 1.0]], posts = [];
    for (let k = 0; k <= 8; k++) posts.push([x0, y0 + (y1 - y0) * k / 8]);
    for (let k = 0; k <= 8; k++) posts.push([x0 + (xe - x0) * k / 8, y1]);
    posts.forEach(([x, y]) => line([[x, y, 0], [x, y, 1.0]], { stroke: "#2b2f34", sw: 1.6 }));
    line(rail, { stroke: "#2b2f34", sw: 2.6 }); line([[x0, y1, 1.0], [xe, y1, 1.0]], { stroke: "#2b2f34", sw: 2.6 });
  }
  if (/^C5\d\d$/.test(u.id)) {
    const r0 = 0.8, cx = u.spiral ? u.spiral[0] : r0 + 0.25, cy = u.spiral ? u.spiral[1] : D * 0.45, steps = 14;   // 도면 나선계단 위치
    const col = [];
    for (let k = 0; k <= 16; k++) { const a = Math.PI * 2 * k / 16; col.push([cx + 0.06 * Math.cos(a), cy + 0.06 * Math.sin(a), 0]); }
    for (let k = 0; k < steps; k++) {
      const a0 = -Math.PI / 2 + k * (Math.PI * 1.7 / steps), a1 = a0 + Math.PI * 1.7 / steps * 0.9, z = (k + 1) * (H / steps);
      poly([[cx, cy, z], [cx + r0 * Math.cos(a0), cy + r0 * Math.sin(a0), z], [cx + r0 * Math.cos(a1), cy + r0 * Math.sin(a1), z]],
           { fill: k % 2 ? "#7a4b32" : "#8a5a3c", stroke: "#f2f2f0", sw: 1 });
    }
    line([[cx, cy, 0], [cx, cy, H + 0.2]], { stroke: "#f5f5f3", sw: 5 });
    line([[cx, cy, 0], [cx, cy, H + 0.2]], { stroke: "#b9b6b0", sw: 1 });
    const rail = [];
    for (let k = 0; k <= 24; k++) { const a = -Math.PI / 2 + k * (Math.PI * 1.7 / 24); rail.push([cx + r0 * Math.cos(a), cy + r0 * Math.sin(a), 0.9 + (k / 24) * H]); }
    line(rail, { stroke: "#2b2f34", sw: 2.2 });
  }

  /* 4-2. 드라이브인(F·FB): 출입문 앞 주차 칸(2.5m × 5.0m, 도면 기준) */
  if (u.drive && st.clean && !u.noPark && u.stalls) {   // 도면 실측 주차칸(통로 건너편 포함)
    const g0 = D + T, gap = u.parkGap || 0, y0 = g0 + gap;
    const xs = u.stalls.flat(), lo = Math.min(-T, ...xs), hi = Math.max(W + T, ...xs);
    if (gap > 0.05) poly([[lo, g0, -0.012], [hi, g0, -0.012], [hi, y0, -0.012], [lo, y0, -0.012]], { fill: "#dcdfe2", stroke: "#b8bdc2", sw: 1 });
    u.stalls.forEach(([a, b, dep]) => {
      const ye = y0 + (dep || 5.0);
      poly([[a, y0, -0.01], [b, y0, -0.01], [b, ye, -0.01], [a, ye, -0.01]], { fill: "#c9ccd0", stroke: "none" });
      [a, b].forEach(x => poly([[x - 0.06, y0 + 0.1, 0], [x + 0.06, y0 + 0.1, 0], [x + 0.06, ye, 0], [x - 0.06, ye, 0]], { fill: "#ffffff", stroke: "none" }));
      if (dep) poly([[a, ye - 0.06, 0], [b, ye - 0.06, 0], [b, ye + 0.06, 0], [a, ye + 0.06, 0]], { fill: "#ffffff", stroke: "none" });   // 평행주차 칸
      else box(a + 0.5, b - 0.5, y0 + 0.75, y0 + 0.9, 0, 0.12, { fy: "#f2c230", fx: "#d9a91a", top: "#f7d55a", edge: "#a07c10" });
    });
  }
  const PARK = u.drive && st.clean && !u.noPark && !u.stalls ? 5.0 : 0;   // 호실 바로 앞이 통로면 없음(FB101·FB102)
  if (PARK) {
    const y0 = D + T, y1 = y0 + PARK, SW = 2.5;
    poly([[-T, y0, -0.01], [W + T, y0, -0.01], [W + T, y1, -0.01], [-T, y1, -0.01]], { fill: "#c9ccd0", stroke: "#9da2a8", sw: 1 });
    const n = u.parkN || Math.max(1, Math.floor((W + T) / SW));   // 도면상 칸 수가 다르면 parkN
    const x0 = u.parkX0 != null ? u.parkX0 : (W - n * SW) / 2;
    for (let i = 0; i <= n; i++) {
      const x = x0 + i * SW;
      poly([[x - 0.06, y0 + 0.15, 0], [x + 0.06, y0 + 0.15, 0], [x + 0.06, y1 - 0.1, 0], [x - 0.06, y1 - 0.1, 0]], { fill: "#ffffff", stroke: "none" });
    }
    for (let i = 0; i < n; i++) {   // 차 막이(카스토퍼)
      const xa = x0 + i * SW + 0.5, xb = x0 + (i + 1) * SW - 0.5;
      box(xa, xb, y0 + 0.75, y0 + 0.9, 0, 0.12, { fy: "#f2c230", fx: "#d9a91a", top: "#f7d55a", edge: "#a07c10" });
    }
  }

  /* 5. 전면 절단벽(문 개구부 제외) */
  const cutC = { fy: COL.cutFace, fx: COL.cutFace, top: COL.cut, edge: "#6b6760" };
  let x = -T;
  doors.slice().sort((a, b) => a[0] - b[0]).forEach(([xa, xb]) => {
    if (xa - x > 0.01) box(x, xa, D, D + T, 0, HC, cutC);
    x = xb;
  });
  if (W - x > 0.01) box(x, W, D, D + T, 0, HC, cutC);
  const sideDoor = u.doorSide === "R" ? [D - u.doorAt - doorW / 2, D - u.doorAt + doorW / 2] : null;
  if (sideDoor) {
    box(W, W + T, -T, sideDoor[0], 0, HC, cutC);
    box(W, W + T, sideDoor[1], D + T, 0, HC, cutC);
    // 옆벽 양개문
    const [ya, yb] = sideDoor, c = (ya + yb) / 2, X = W + T;
    box(W, W + T, ya - 0.08, yb + 0.08, 0, doorH + 0.08, { fy: "#3f4650", fx: "#3f4650", top: "#2b3037", edge: "#2b3037" });
    (u.single ? [[ya, yb]] : [[ya, c], [c, yb]]).forEach(([p, q]) => {
      poly([[X + 0.002, p + 0.02, 0.02], [X + 0.002, q - 0.02, 0.02], [X + 0.002, q - 0.02, doorH], [X + 0.002, p + 0.02, doorH]], { fill: "#7a838e", stroke: "#2b3037", sw: 1 });
      poly([[X + 0.004, p + 0.2, doorH * 0.55], [X + 0.004, q - 0.2, doorH * 0.55], [X + 0.004, q - 0.2, doorH - 0.2], [X + 0.004, p + 0.2, doorH - 0.2]], { fill: "#c3ccd4", stroke: "#2b3037", sw: 0.8 });
    });
    (u.single ? [ya + 0.15] : [c - 0.1, c + 0.1]).forEach(hy => line([[X + 0.006, hy, 0.95], [X + 0.006, hy, 1.2]], { stroke: "#e2e6ea", sw: 2.4 }));
  } else box(W, W + T, -T, D + T, 0, HC, cutC);

  if (REAL) realCols.filter(([x0, x1, y0, y1]) => !(y1 < D - 0.05 && x1 < W - 0.05))
                    .forEach(([x0, x1, y0, y1]) => box(x0, x1, y0, y1, 0, HC, { fy: COL.cutFace, fx: COL.cutFace, top: COL.cut, edge: "#6b6760" }));

  /* 6. 문틀(점선) · 셔터 / 양개문 */
  if (st.clean) doors.forEach(([xa, xb]) => {
    const y = D + T / 2, c = (xa + xb) / 2;
    box(xa - 0.08, xb + 0.08, D, D + T, 0, doorH + 0.08, { fy: "#3f4650", fx: "#3f4650", top: "#2b3037", edge: "#2b3037" });
    (u.single ? [[xa, xb]] : [[xa, c], [c, xb]]).forEach(([p, q]) => {
      poly([[p + 0.02, D + T + 0.002, 0.02], [q - 0.02, D + T + 0.002, 0.02], [q - 0.02, D + T + 0.002, doorH], [p + 0.02, D + T + 0.002, doorH]], { fill: "#7a838e", stroke: "#2b3037", sw: 1 });
      poly([[p + 0.2, D + T + 0.004, doorH * 0.55], [q - 0.2, D + T + 0.004, doorH * 0.55], [q - 0.2, D + T + 0.004, doorH - 0.2], [p + 0.2, D + T + 0.004, doorH - 0.2]], { fill: "#c3ccd4", stroke: "#2b3037", sw: 0.8 });
    });
    (u.single ? [xb - 0.15] : [c - 0.1, c + 0.1]).forEach(hx => line([[hx, D + T + 0.006, 0.95], [hx, D + T + 0.006, 1.2]], { stroke: "#e2e6ea", sw: 2.4 }));
  });
  if (!st.clean) doors.forEach(([xa, xb]) => {
    line([[xa, D + T / 2, 0], [xa, D + T / 2, doorH], [xb, D + T / 2, doorH], [xb, D + T / 2, 0]], { stroke: COL.door, sw: 1.6, dash: "6 5" });
    if (u.drive) {
      box(xa - 0.05, xb + 0.05, D, D + T + 0.12, doorH, doorH + 0.3, { fy: "#c9ced2", fx: "#b5bbc0", top: "#dde1e4", edge: "#7c848a" });
      for (let z = doorH + 0.07; z < doorH + 0.3; z += 0.07) line([[xa - 0.05, D + T + 0.12, z], [xb + 0.05, D + T + 0.12, z]], { stroke: "#9aa1a7", sw: 0.8 });
    }
  });

  /* 7. 치수(실측값이 있을 때만) */
  const dimOps = [];
  const measured = !!(u.rooms && u.rooms.every(r => r.w));
  if (measured || st.clean) {   // 네이버 광고 정책: 이미지에는 가로·세로 숫자만(예: 4.3M)
    const DIM = st.clean ? "#e11d2a" : COL.dim, fs = st.clean ? 0.62 : 0.5, pre = measured || st.clean ? "" : "약 ";
    const fmt = v => measured && !st.clean ? v.toFixed(2) : (Math.round(v * 10) / 10).toFixed(1);
    const yd = D + T + PARK + 0.9;   // 주차 칸이 있으면 그 바깥에 치수선
    rooms.forEach(r => {
      dimOps.push({ t: "line", pts: [[r.ox, yd, 0], [r.ox + r.w, yd, 0]], stroke: DIM, sw: 2 });
      [r.ox, r.ox + r.w].forEach(xx => dimOps.push({ t: "line", pts: [[xx, D + T + PARK + 0.3, 0], [xx, yd + 0.25, 0]], stroke: DIM, sw: 1.2 }));
      dimOps.push({ t: "ftext", at: [r.ox + r.w / 2, yd + 0.65, 0], str: st.clean ? `${fmt(r.w)}M` : `${pre}${fmt(r.w)}m`, size: fs, fill: DIM, weight: 800 });
    });
    const xd = W + T + 0.9;
    dimOps.push({ t: "line", pts: [[xd, 0, 0], [xd, D, 0]], stroke: DIM, sw: 2 });
    [0, D].forEach(yy => dimOps.push({ t: "line", pts: [[W + T + 0.3, yy, 0], [xd + 0.25, yy, 0]], stroke: DIM, sw: 1.2 }));
    const dR = u.slant ? u.slant[1] : D;   // 사선이면 오른쪽 끝 깊이
    dimOps.push({ t: "ftextY", at: [xd + 0.35, D / 2, 0], str: st.clean ? `${fmt(dR)}M` : `${pre}${fmt(dR)}m`, size: fs, fill: DIM, weight: 800 });
    if (u.slant) {   // 왼쪽 끝 깊이(실내 바닥, 왼쪽 벽 옆)
      const xl = 0.45;
      dimOps.push({ t: "line", pts: [[xl, 0.05, 0.01], [xl, D - 0.05, 0.01]], stroke: DIM, sw: 2 });
      [0.05, D - 0.05].forEach(yy => dimOps.push({ t: "line", pts: [[xl - 0.2, yy, 0.01], [xl + 0.2, yy, 0.01]], stroke: DIM, sw: 2 }));
      dimOps.push({ t: "ftextY", at: [xl + 0.45, D / 2, 0.01], str: `${fmt(u.slant[0])}M`, size: fs, fill: DIM, weight: 800 });
    }
    // 높이: 왼쪽 앞 모서리 바깥
    {
    const hp = [-T - 0.5, D + T + 0.5 + PARK];
    dimOps.push({ t: "line", pts: [[hp[0], hp[1], 0], [hp[0], hp[1], H]], stroke: DIM, sw: 2 });
    [0, H].forEach(zz => dimOps.push({ t: "line", pts: [[hp[0] - 0.15, hp[1] + 0.15, zz], [hp[0] + 0.15, hp[1] - 0.15, zz]], stroke: DIM, sw: 2 }));
    if (upperH) {   // C5xx 위층 높이
      dimOps.push({ t: "line", pts: [[hp[0], hp[1], H], [hp[0], hp[1], H + upperH]], stroke: DIM, sw: 2 });

const LISTING = new Set(UNITS.map(u => u.id));
const LIST = (() => {
  const by = new Map(ALL.map(u => [u.id, u]));
  const out = ALL.map(u => {
    const l = UNITS.find(x => x.id === u.id);
    return l ? { ...u, ...l, w: u.w, d: u.d } : u;   // 치수는 항상 전 호실 데이터 기준
  });
  UNITS.filter(u => u.rooms).forEach(u => {           // 두 호실 연속 도면
    const upd = u.rooms.map(r => (by.get(r.id) || {}).updated).filter(Boolean).sort().pop();
    out.push({ ...u, updated: upd || "" });
  });
  const key = id => { const m = id.match(/^(KA|KB|FB|F|C)(\d+)/); const t = { FB: 0, F: 1, C: 2, KA: 3, KB: 4 }[m[1]]; return t * 1e5 + parseInt(m[2], 10); };
  return out.sort((a, b) => key(a.id) - key(b.id));
})();
const state = {};
const stOf = u => state[u.id] || (state[u.id] = { sink: !!u.sink, blind: !!u.blind, curtain: !!u.curtain });
UNITS.forEach(stOf);

const grp = id => id.match(/^(KA|KB|FB|F|C)/)[1];
const floorOf = id => { const m = id.match(/^(KA|KB|FB|F|C)(\d+)/); return m[1] === "FB" ? "B" + m[2][0] : String(parseInt(m[2].slice(0, -2), 10)); };
const stFor = u => ({ ...stOf(u), clean: true, balcony: !u.id.startsWith("FB") && true && !u.noWin });
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
function metaHTML(u) {
  const rooms = u.rooms || [u];
  const dims = rooms.every(r => r.w) ? rooms.map(r => `${fmt1(r.w)}×${fmt1(r.d)}M`).join(" + ") : "치수 미확인";
  const h = floorHeight(u.rooms ? u.rooms[0].id : u.id);
  return `<div class="meta"><span>가로×세로 <b>${dims}</b> · 높이 <b>${h.toFixed(1)}M</b></span><span class="date">${u.updated ? u.updated + " 수정" : ""}</span></div>`;
}
function cardHTML(u, eager) {
  const cap = [u.title || u.id, `${u.area}평`, u.dir].filter(Boolean).join(" · ");
  const sheet = eager ? `<div class="sheet" id="sheet-${u.id}">${renderUnit(u, stFor(u))}</div>`
                      : `<div class="sheet lazy" id="sheet-${u.id}" data-lazy="1"></div>`;
  return `
    <article class="card" data-id="${u.id}">
      <div class="cap">${cap}</div>
      ${sheet}
      ${eager ? "" : metaHTML(u)}
      <div class="toggles">
        <button type="button" data-t="sink" aria-pressed="${stOf(u).sink}">싱크대</button>
        <button type="button" data-t="blind" aria-pressed="${stOf(u).blind}">블라인드</button>
      </div>
    </article>`;
}

const grid = document.getElementById("grid");
const byId = new Map(LIST.map(u => [u.id, u]));
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target; io.unobserve(el);
  const u = byId.get(el.closest(".card").dataset.id);
  el.innerHTML = renderUnit(u, stFor(u)); el.classList.remove("lazy"); delete el.dataset.lazy;
}), { rootMargin: "600px 0px" }) : null;
function hydrate() {
  grid.querySelectorAll(".sheet[data-lazy]").forEach(el => {
    if (io) io.observe(el);
    else { const u = byId.get(el.closest(".card").dataset.id); el.innerHTML = renderUnit(u, stFor(u)); el.classList.remove("lazy"); }
  });
}
let filter = "all";
const qEl = document.getElementById("q"), fEl = document.getElementById("floor");
[...new Set(LIST.map(u => floorOf(u.id)))].sort((a, b) => (a[0] === "B" ? -10 + +a[1] : +a) - (b[0] === "B" ? -10 + +b[1] : +b))
  .forEach(f => fEl.insertAdjacentHTML("beforeend", `<option value="${f}">${f[0] === "B" ? "지하 " + f[1] : f}층</option>`));
function applyFilter() {
  const q = qEl.value.trim().toUpperCase().replace(/[\s호]/g, "");
  const fl = fEl.value;
  const rows = LIST.filter(u => {
    if (filter === "listing" ? !LISTING.has(u.id) : filter !== "all" && grp(u.id) !== filter) return false;
    if (fl && floorOf(u.id) !== fl) return false;
    if (q && !(u.id.replace("-", "").includes(q) || (u.rooms || []).some(r => r.id.includes(q)))) return false;
    return true;
  });
  grid.innerHTML = rows.map(u => cardHTML(u, false)).join("");
  hydrate();
  document.getElementById("count").textContent = `${rows.length}개 도면 / 전 ${LIST.length}개`;
}
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  applyFilter();
});
qEl.addEventListener("input", applyFilter);
fEl.addEventListener("change", applyFilter);
grid.addEventListener("click", e => {
  const b = e.target.closest(".toggles button"); if (!b) return;
  const card = b.closest(".card"); const u = byId.get(card.dataset.id);
  stOf(u)[b.dataset.t] = !stOf(u)[b.dataset.t];
  u[b.dataset.t] = stOf(u)[b.dataset.t];
  card.querySelector(".sheet").innerHTML = renderUnit(u, stFor(u));
  b.setAttribute("aria-pressed", stOf(u)[b.dataset.t]);
});
// 내보내기(PNG) 모드: 매물 호실만, 바로 그림
function renderAll() { grid.innerHTML = UNITS.map(u => cardHTML(byId.get(u.id) || u, true)).join(""); }
if (/[?&]export\b/.test(location.search)) document.body.classList.add("export");
const sampleId = (location.search.match(/[?&]sample=([^&]+)/) || [])[1];
if (sampleId) {
  const u = UNITS.find(x => x.id === sampleId);
  document.body.classList.add("export");
  grid.innerHTML = `<div class="sheet clean" id="sheet-${u.id}-clean">${renderUnit(u, { ...state[u.id], clean: true, balcony: !u.id.startsWith("FB") && true })}</div>`;
} else if (document.body.classList.contains("export")) renderAll();
else applyFilter();
