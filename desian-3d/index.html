<title>데시앙 호실 3D 개념도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  :root {
    --ground: #eef0ec;
    --ink: #1c2229;
    --muted: #5d6670;
    --line: #d5d9d3;
    --accent: #0f5c55;
    --accent-soft: #dcebe8;
    --brass: #a8752a;
    --brass-soft: #f4e9d6;
    --chip-bg: #ffffff;
    /* 카드(내보내기 이미지)는 두 테마 모두 밝은 인쇄물로 고정 */
    --sheet: #ffffff;
    --sheet-ink: #1c2229;
    --sheet-muted: #5d6670;
    --sheet-line: #e2e4df;
    --sheet-band: #f5f6f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #151a1d;
      --ink: #e8ece9;
      --muted: #9aa4a8;
      --line: #2c3438;
      --accent: #5fbfb3;
      --accent-soft: #1e3532;
      --brass: #d9a95c;
      --brass-soft: #3a2f1f;
      --chip-bg: #1d2427;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #151a1d;
    --ink: #e8ece9;
    --muted: #9aa4a8;
    --line: #2c3438;
    --accent: #5fbfb3;
    --accent-soft: #1e3532;
    --brass: #d9a95c;
    --brass-soft: #3a2f1f;
    --chip-bg: #1d2427;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 28px 16px 48px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }
  header.top { display: grid; gap: 10px; }
  header.top h1 { margin: 0; font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  header.top p { margin: 0; color: var(--muted); max-width: 70ch; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters button {
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip-bg); color: var(--ink);
  }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters button:focus-visible, .toggles button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 20px; }
  .card { display: grid; gap: 8px; }
  .cap { font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .toggles { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggles button {
    font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip-bg); color: var(--muted);
  }
  .toggles button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* ── 내보내기 시트 ── */
  .sheet {
    background: var(--sheet); color: var(--sheet-ink);
    border: 1px solid var(--sheet-line); border-radius: 10px; overflow: hidden;
    display: grid;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 16px 18px 6px; }
  .sheet-head .no { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .sheet-head .no small { font-size: 0.6em; font-weight: 700; margin-left: 2px; }
  .sheet-head .where { text-align: right; font-size: 13px; color: var(--sheet-muted); line-height: 1.35; }
  .sheet-head .where b { display: block; color: var(--sheet-ink); font-weight: 700; font-size: 14px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px; min-height: 22px; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #dcebe8; color: #0f5c55; }
  .badge.brass { background: #f4e9d6; color: #8a5d1c; }
  .drawing { width: 100%; height: auto; display: block; }
  .specs {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--sheet-line); background: var(--sheet-band);
  }
  .spec { padding: 9px 12px; border-left: 1px solid var(--sheet-line); min-width: 0; }
  .spec:first-child { border-left: 0; }
  .spec dt { font-size: 11px; color: var(--sheet-muted); letter-spacing: 0.04em; }
  .spec dd { margin: 0; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .spec dd.off { color: #9a3b2f; }
  .spec dd.on { color: #0f5c55; }
  .note { padding: 8px 18px 0; font-size: 13px; color: var(--sheet-ink); }
  .foot { display: flex; justify-content: space-between; gap: 10px; padding: 8px 18px 12px; font-size: 11px; color: var(--sheet-muted); }

  /* 지하 드라이브인(FB) 시트 — 참고 이미지 양식 */
  .sheet.fb { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); align-items: start; }
  .fb-left { padding: 22px 8px 12px 22px; display: grid; gap: 4px; align-content: start; }
  .fb-left .t1 { font-size: 26px; font-weight: 800; color: #1f2a44; letter-spacing: -0.02em; line-height: 1.15; }
  .fb-left .t2 { font-size: 19px; font-weight: 800; color: #4a5688; }
  .fb-left .t3 { font-size: 13px; color: #4a5688; }
  .fb-left ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: #1f2a44; }
  .fb-left li::before { content: "· "; }
  .fb-brand { margin-top: 16px; font-size: 20px; font-weight: 800; color: #1f2a44; line-height: 1.2; }
  .fb-brand span { color: #2563eb; }
  .fb-brand div { font-variant-numeric: tabular-nums; }
  .fb-right { padding: 8px 8px 0 0; min-width: 0; }
  .fb-foot { grid-column: 1 / -1; padding: 4px 22px 14px; font-size: 11px; color: #5d6670; }
  @media (max-width: 560px) { .sheet.fb { grid-template-columns: 1fr; } .fb-right { padding: 0 8px; } }

  /* 내보내기 모드(PNG 렌더용) */
  body.export { background: #ffffff; padding: 0; }
  body.export header.top, body.export .toggles, body.export .cap { display: none; }
  body.export .wrap { max-width: none; gap: 0; }
  body.export .grid { grid-template-columns: max-content; gap: 24px; padding: 12px; }
  body.export .sheet { width: 1080px; }
  body.export .sheet.fb { width: 1500px; }
  body.export .fb-left { padding: 40px 10px 20px 44px; gap: 6px; }
  body.export .fb-left .t1 { font-size: 50px; }
  body.export .fb-left .t2 { font-size: 34px; }
  body.export .fb-left .t3 { font-size: 21px; }
  body.export .fb-left ul { font-size: 21px; gap: 6px; margin-top: 18px; }
  body.export .fb-brand { font-size: 38px; margin-top: 30px; }
  body.export .fb-foot { font-size: 17px; padding: 6px 44px 24px; }
  body.export .sheet { border-radius: 0; border-color: #e2e4df; }
  body.export .sheet-head { padding: 26px 32px 8px; }
  body.export .sheet-head .no { font-size: 46px; }
  body.export .sheet-head .where { font-size: 18px; }
  body.export .sheet-head .where b { font-size: 21px; }
  body.export .badges { padding: 0 32px; }
  body.export .badge { font-size: 16px; padding: 3px 10px; }
  body.export .spec { padding: 14px 20px; }
  body.export .spec dt { font-size: 15px; }
  body.export .spec dd { font-size: 24px; }
  body.export .note { padding: 12px 32px 0; font-size: 18px; }
  body.export .foot { padding: 12px 32px 18px; font-size: 15px; }

  @media (max-width: 460px) {
    .specs { grid-template-columns: repeat(2, 1fr); }
    .spec:nth-child(3) { border-left: 0; }
    .spec:nth-child(n+3) { border-top: 1px solid var(--sheet-line); }
    .sheet-head .no { font-size: 24px; }
  }
</style>

<div class="wrap">
  <header class="top">
    <h1>DMC 플렉스 데시앙 · 호실 3D 개념도</h1>
    <p>네이버 등록용으로 글씨 없이 도면과 치수만 담은 개념도입니다. 카드 위 호실 표기는 구분용이며 이미지에는 들어가지 않습니다. FB102·103 외 치수는 전용면적 기준 추정치(약)입니다.</p>
    <div class="filters" role="group" aria-label="동 필터">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="KA" aria-pressed="false">A동 (KA)</button>
      <button type="button" data-f="KB" aria-pressed="false">B동 (KB)</button>
      <button type="button" data-f="F" aria-pressed="false">드라이브인 (F·FB)</button>
    </div>
    <div class="count" id="count"></div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<script>
/* ───────── 호실 데이터 (매물장 · 임대가능호실 시트 기준, 2026-09-24) ─────────
   sink / blind : true 있음, false 없음, null 정보 없음(그리지 않음)
   corner       : [주 창 방향, 측면 창 방향]
   rooms        : 두 호실 연속 도면 (w·d 실측값이 있으면 그대로 사용)             */
const UNITS = [
  { id: "KB805",  area: 11.18, dir: "서향", sink: false, blind: false },
  { id: "KB806",  area: 14.23, dir: "서향", sink: false, blind: false },
  { id: "KB1316", area: 14.48, dir: "동향", sink: false, blind: false },
  { id: "KB916",  area: 14.48, dir: "동향", sink: false, blind: false },
  { id: "KB932",  area: 14.48, dir: "동향", sink: false, blind: false },
  { id: "KB608",  area: 13.72, dir: "서향", sink: false, blind: false },
  { id: "KB1814", area: 18.62, dir: "동향", sink: true,  blind: null },
  { id: "KA604",  area: 18.62, dir: "동향", sink: null,  blind: null },
  { id: "KA605",  area: 18.62, dir: "동향", sink: null,  blind: null },
  { id: "KA611",  area: 14.21, dir: "남향", sink: null,  blind: null, terrace: true,
    note: "단독 테라스" },
  { id: "FB232", height: 3.0,  area: 16.38, dir: null,   sink: null,  blind: null, drive: true },
  { id: "FB204", height: 3.0,  area: 17.64, dir: null,   sink: null,  blind: null, drive: true },
  { id: "KB1226", area: 18.62, dir: "동향", sink: true,  blind: true,
    note: "연계 호실 가능" },
  { id: "F441",   area: 10.67, dir: "남향", sink: null,  blind: null, drive: true },
  { id: "F326",   area: 16.5,  dir: "동향", sink: null,  blind: null, drive: true },
  { id: "F532",   area: 18.79, dir: "동향", sink: null,  blind: null, drive: true },
  { id: "KA911",  area: 20.94, dir: "남동향 코너", corner: ["남", "동"], sink: true, blind: null, curtain: true,
    sinkLabel: "대리석", note: "대리석 싱크대 · 쉬폰 커튼 · 바닥 인테리어 · 에어컨" },
  { id: "KA2002", area: 25.11, dir: "서향",  sink: null, blind: null },
  { id: "KB1901", area: 22.7,  dir: "북서 코너", corner: ["북", "서"], sink: null, blind: null },
  { id: "F228",   area: 27.17, dir: "동향",  sink: null, blind: null, drive: true },
  { id: "F427",   area: 25.66, dir: "동향",  sink: null, blind: null, drive: true },
  { id: "F419",   area: 27.17, dir: "북동 코너", corner: ["북", "동"], sink: null, blind: null, drive: true },
  { id: "F347",   area: 29,    dir: "서향",  sink: null, blind: null, drive: true },
  { id: "KB1712-1713", title: "KB1712·1713", area: 31.28, dir: "북동향", sink: null, blind: true,
    rooms: [{ id: "KB1712", area: 15.64 }, { id: "KB1713", area: 15.64 }],
    note: "두 호실 연속 · 가벽 유지(터놓지 않음) · 일괄 임차" },
  { id: "FB102-103", title: "FB102·103", area: 44.55, dir: null, sink: false, blind: false, drive: true,
    height: 3.0, door: 2.10, doorH: 2.12,
    rooms: [{ id: "FB102", area: 21.64, m2: 71.54, w: 4.92, d: 13.51 }, { id: "FB103", area: 22.91, m2: 75.73, w: 5.21, d: 13.52 }],
    fbBullets: ["호실마다 출입문 1개 (2.10×2.12m)", "두 호실 따로 / 합쳐서 임대 가능"],
    note: "층고 약 3M(FB102 2.94m · FB103 2.99m) · 출입문 2.10×2.12m · 따로/합쳐서 가능" },
  { id: "KA1906", area: 39.56, dir: "남동향 코너", corner: ["남", "동"], sink: null, blind: null },
  { id: "KB1710", area: 10.67, dir: "서향",  sink: null, blind: null },
  { id: "KB1630", area: 13.97, dir: "남향",  sink: null, blind: null },
  { id: "FB111", height: 3.0,  area: 18.75, dir: null,    sink: null, blind: null, drive: true },
  { id: "KB611",  area: 18.62, dir: "동향",  sink: null, blind: null },
  { id: "KB1135", area: 25,    dir: null,    sink: null, blind: null },
];

const M2_PER_PY = 3.305785;

/* 호실 코드 → 동 · 층 */
function locate(id) {
  const m = id.match(/^(KA|KB|FB|F)(\d+)/);
  const [, pre, num] = m;
  if (pre === "FB") return { dong: "드라이브인", floor: "B" + num[0] + "층" };
  const floor = parseInt(num.slice(0, -2), 10) + "층";
  if (pre === "F") return { dong: "드라이브인", floor };
  return { dong: pre === "KA" ? "A동" : "B동", floor };
}

/* 전용면적 → 개념도용 가로(창측)·세로(깊이) 추정 */
function estimateDims(py, corner) {
  const a = py * M2_PER_PY;
  let ratio = py < 12 ? 2.3 : py < 16 ? 2.0 : py < 20 ? 1.7 : py < 26 ? 1.45 : 1.25;
  if (corner) ratio = Math.max(1.0, ratio * 0.75);
  const w = Math.sqrt(a / ratio);
  return { w, d: a / w };
}

/* ───────── 등각 투상 ───────── */
const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
const proj = ([x, y, z]) => [(x - y) * C30, (x + y) * S30 - z];

const COL = {
  floor: "#e7e3db", tile: "#d8d3c9",
  wallX: "#e9e6e0", wallY: "#f6f4f0", wallTop: "#b9b3a8", wallEnd: "#d3cec5", edge: "#8d887f",
  cut: "#4a4f55", cutFace: "#d9d5ce",
  glass: "#bcd6e2", glassEdge: "#6f95a8",
  blind: "#efe5d2", blindLine: "#cdb994",
  curtain: "#ffffff", curtainLine: "#d8d4cc",
  cabinet: "#fbfbfa", cabinetSide: "#ecebe7", counter: "#a7adb2", counterTop: "#c3c8cc", basin: "#8e959b",
  marble: "#ebe8e3", marbleTop: "#f4f2ee",
  leaf: "#c9a57e", door: "#5f6f7c",
  deck: "#c9a57a", plank: "#ad885b", rail: "#6b6f73",
  dim: "#0f5c55", tagBg: "#0f5c55", tagInk: "#ffffff",
};

function renderUnit(u, st) {
  const VW = 1000, VH = 720;
  const H = u.height || (u.drive ? 3.0 : 2.7);
  const T = 0.18;            // 벽 두께
  const HC = 0.22;           // 전면 절단벽 높이
  const rooms = (u.rooms || [{ id: u.id, area: u.area }]).map(r => {
    const fbDepth = { "2": 9.5, "1": 13.5 }[u.id.startsWith("FB") ? u.id[2] : ""];
    const dm = r.w ? { w: r.w, d: r.d }
      : fbDepth ? { w: (r.area * M2_PER_PY) / fbDepth, d: fbDepth }
      : estimateDims(r.area, u.corner);
    return { ...r, ...dm };
  });
  let ox = 0;
  rooms.forEach(r => { r.ox = ox; ox += r.w; });
  const W = ox, D = Math.max(...rooms.map(r => r.d));
  const hasWin = !u.id.startsWith("FB");   // 지하 드라이브인(FB)은 창 없이 표현
  const win = { sill: 0.12, head: H - 0.3 };

  const ops = [];
  const poly = (pts, s) => ops.push({ t: "poly", pts, ...s });
  const path = (rings, s) => ops.push({ t: "path", rings, ...s });
  const line = (pts, s) => ops.push({ t: "line", pts, ...s });
  const ftext = (x, y, z, str, size, s) => { if (!st.clean) ops.push({ t: "ftext", at: [x, y, z], str, size, ...s }); };
  const tag = (p, str) => { if (!st.clean) ops.push({ t: "tag", at: p, str }); };

  // 박스: 보이는 면(+y, +x, 윗면)만 그림
  function box(x0, x1, y0, y1, z0, z1, c) {
    poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], { fill: c.fy, stroke: c.edge || COL.edge });
    poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], { fill: c.fx, stroke: c.edge || COL.edge });
    poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], { fill: c.top, stroke: c.edge || COL.edge });
  }
  const rectY = (x0, x1, z0, z1, y = 0) => [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]];
  const rectX = (y0, y1, z0, z1, x = 0) => [[x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1]];

  /* 1. 바닥 + 타일 + 호실 표기 */
  rooms.forEach((r, i) => {
    poly([[r.ox, 0, 0], [r.ox + r.w, 0, 0], [r.ox + r.w, r.d, 0], [r.ox, r.d, 0]], { fill: COL.floor, stroke: COL.edge });
    const g = 0.6;
    for (let x = r.ox + g; x < r.ox + r.w - 0.05; x += g) line([[x, 0, 0], [x, r.d, 0]], { stroke: COL.tile, sw: 0.8 });
    for (let y = g; y < r.d - 0.05; y += g) line([[r.ox, y, 0], [r.ox + r.w, y, 0]], { stroke: COL.tile, sw: 0.8 });
    const size = Math.min(0.9, r.w * 0.19, r.d * 0.14);
    if (i < rooms.length - 1) {
      // 오른쪽 가벽 뒤로 가려지지 않게 깊이 방향으로 눕혀 표기
      const fx = r.ox + size * 0.6;
      if (!st.clean) ops.push({ t: "ftextY", at: [fx, r.d * 0.5, 0], str: r.id, size, fill: "#6f6a60", weight: 800 });
      if (!st.clean) ops.push({ t: "ftextY", at: [fx + size * 0.95, r.d * 0.5, 0], str: `${r.area}평`, size: size * 0.62, fill: "#7d786e", weight: 700 });
    } else {
      const cx = r.ox + r.w / 2, cy = r.d * 0.5;
      ftext(cx, cy, 0, r.id, size, { fill: "#6f6a60", weight: 800 });
      ftext(cx, cy + size * 1.05, 0, `${r.area}평`, size * 0.62, { fill: "#7d786e", weight: 700 });
    }
  });

  /* 2. 테라스 (창 밖) */
  if (u.terrace) {
    const td = 2.4;
    poly([[0, -T, 0], [W, -T, 0], [W, -T - td, 0], [0, -T - td, 0]], { fill: COL.deck, stroke: COL.plank });
    for (let x = 0.3; x < W; x += 0.3) line([[x, -T, 0], [x, -T - td, 0]], { stroke: COL.plank, sw: 0.8 });
    const ry = -T - td;
    for (let x = 0; x <= W + 0.01; x += W / Math.ceil(W / 1.2)) line([[x, ry, 0], [x, ry, 1.1]], { stroke: COL.rail, sw: 1.6 });
    line([[0, ry, 1.1], [W, ry, 1.1]], { stroke: COL.rail, sw: 2.2 });
    line([[W, ry, 1.1], [W, -T, 1.1]], { stroke: COL.rail, sw: 2.2 });
    line([[W, -T, 0], [W, -T, 1.1]], { stroke: COL.rail, sw: 1.6 });
    tag([W, -T - td * 0.6, 1.5], "단독 테라스");
  }

  /* 2-1. 발코니 — 외부 유리 커튼월로 막힌 실내형(서비스) 발코니 */
  const BD = 1.5, BY = -T - BD, XB = -T - BD;
  if (st.balcony && hasWin) {
    const corner = !!u.corner;          // 코너 호실: 발코니가 두 면을 ㄱ자로 감쌈
    const x0 = corner ? XB : 0;
    if (corner) {
      box(XB, -T, -T, D, -0.12, 0, { fy: "#cfcbc4", fx: "#c2bdb5", top: "#dcdde0" });
      for (let y = 0.6; y < D; y += 0.6) line([[XB, y, 0.002], [-T, y, 0.002]], { stroke: "#c9cacd", sw: 0.8 });
      poly(rectX(BY, D, 0, H, XB), { fill: "#c7dde8", op: 0.6, stroke: "#6f8a98", sw: 1.4 });
      const m = Math.max(2, Math.round((D - BY) / 0.9));
      for (let k = 1; k < m; k++) { const y = BY + (D - BY) * k / m; line([[XB, y, 0], [XB, y, H]], { stroke: "#6f8a98", sw: 1.2 }); }
      line([[XB, BY, 1.1], [XB, D, 1.1]], { stroke: "#6f8a98", sw: 1.2 });
      box(XB - T, XB, BY - T, D, H - 0.001, H, { fy: COL.wallTop, fx: COL.wallTop, top: COL.wallTop });
      box(XB - T, -T, D, D + T, 0, H, { fy: COL.wallEnd, fx: COL.wallEnd, top: COL.wallTop });
    }
    box(x0, W, BY, -T, -0.12, 0, { fy: "#cfcbc4", fx: "#c2bdb5", top: "#dcdde0" });
    for (let x = 0.6; x < W; x += 0.6) line([[x, -T, 0.002], [x, BY, 0.002]], { stroke: "#c9cacd", sw: 0.8 });
    for (let y = -T - 0.6; y > BY; y -= 0.6) line([[0, y, 0.002], [W, y, 0.002]], { stroke: "#c9cacd", sw: 0.8 });
    // 외부 커튼월(바닥~천장 유리)
    poly(rectY(x0, W, 0, H, BY), { fill: "#c7dde8", op: 0.6, stroke: "#6f8a98", sw: 1.4 });
    const n = Math.max(2, Math.round((W - x0) / 0.9));
    for (let k = 1; k < n; k++) { const x = x0 + (W - x0) * k / n; line([[x, BY, 0], [x, BY, H]], { stroke: "#6f8a98", sw: 1.2 }); }
    line([[x0, BY, 1.1], [W, BY, 1.1]], { stroke: "#6f8a98", sw: 1.2 });
    // 양옆 벽
    if (!corner) box(-T, 0, BY - T, -T, 0, H, { fy: COL.wallEnd, fx: COL.wallX, top: COL.wallTop });
    box(x0 - (corner ? T : 0), W, BY - T, BY, H - 0.001, H, { fy: COL.wallTop, fx: COL.wallTop, top: COL.wallTop });
    box(W, W + T, BY - T, -T, 0, H, { fy: COL.wallEnd, fx: COL.wallEnd, top: COL.wallTop });
  }

  /* 창 · 블라인드 · 커튼 */
  function windowOnY(x0, x1) {           // y=0 벽(주 창)
    poly(rectY(x0, x1, win.sill, win.head, 0), { fill: COL.glass, op: 0.5, stroke: COL.glassEdge, sw: 1.4 });
    const n = Math.max(1, Math.round((x1 - x0) / 1.2));
    for (let i = 1; i < n; i++) {
      const x = x0 + (x1 - x0) * i / n;
      line([[x, 0, win.sill], [x, 0, win.head]], { stroke: COL.glassEdge, sw: 1.4 });
    }
    line([[x0, 0, win.sill + 0.5], [x1, 0, win.sill + 0.5]], { stroke: COL.glassEdge, sw: 1 });
    if (st.blind) blinds((zz) => [[x0, 0.01, zz], [x1, 0.01, zz]], (za, zb) => rectY(x0, x1, za, zb, 0.01));
    if (st.curtain) curtains((a, za, zb) => rectY(x0 + a[0] * (x1 - x0), x0 + a[1] * (x1 - x0), za, zb, 0.02),
                             (f, za, zb) => [[x0 + f * (x1 - x0), 0.02, za], [x0 + f * (x1 - x0), 0.02, zb]], x1 - x0);
  }
  function windowOnX(y0, y1) {           // x=0 벽(코너 측창)
    poly(rectX(y0, y1, win.sill, win.head, 0), { fill: COL.glass, op: 0.5, stroke: COL.glassEdge, sw: 1.4 });
    const n = Math.max(1, Math.round((y1 - y0) / 1.2));
    for (let i = 1; i < n; i++) {
      const y = y0 + (y1 - y0) * i / n;
      line([[0, y, win.sill], [0, y, win.head]], { stroke: COL.glassEdge, sw: 1.4 });
    }
    line([[0, y0, win.sill + 0.5], [0, y1, win.sill + 0.5]], { stroke: COL.glassEdge, sw: 1 });
    if (st.blind) blinds((zz) => [[0.01, y0, zz], [0.01, y1, zz]], (za, zb) => rectX(y0, y1, za, zb, 0.01));
    if (st.curtain) curtains((a, za, zb) => rectX(y0 + a[0] * (y1 - y0), y0 + a[1] * (y1 - y0), za, zb, 0.02),
                             (f, za, zb) => [[0.02, y0 + f * (y1 - y0), za], [0.02, y0 + f * (y1 - y0), zb]], y1 - y0);
  }
  function blinds(seg, rect) {
    const zb = win.head - (win.head - win.sill) * 0.55;
    poly(rect(zb, win.head), { fill: COL.blind, op: 0.93, stroke: COL.blindLine, sw: 1 });
    for (let z = win.head - 0.07; z > zb + 0.02; z -= 0.07) line(seg(z), { stroke: COL.blindLine, sw: 0.7 });
    line(seg(zb), { stroke: "#a8926a", sw: 2 });
    line(seg(win.head + 0.04), { stroke: "#a8926a", sw: 3 });
  }
  function curtains(rect, vline, len) {
    const pw = Math.min(0.18, 0.8 / len);
    [[0, pw], [1 - pw, 1]].forEach(a => {
      poly(rect(a, win.sill + 0.02, win.head), { fill: COL.curtain, op: 0.78, stroke: COL.curtainLine, sw: 1 });
      for (let k = 1; k < 5; k++) line(vline(a[0] + (a[1] - a[0]) * k / 5, win.sill + 0.02, win.head), { stroke: COL.curtainLine, sw: 0.8 });
    });
    const zr = win.head + 0.05;
    line([vline(0, zr, zr)[0], vline(1, zr, zr)[0]], { stroke: "#9b968c", sw: 2 });
  }

  /* 3. 뒷벽: x=0(좌) — 코너면 측창 */
  const sideWin = u.corner ? [0.25, Math.max(1.5, D - 1.6)] : null;
  const leftFace = rectX(0, D, 0, H, 0);
  if (sideWin) path([leftFace, rectX(sideWin[0], sideWin[1], win.sill, win.head, 0)], { fill: COL.wallX, stroke: COL.edge });
  else poly(leftFace, { fill: COL.wallX, stroke: COL.edge });
  if (sideWin) windowOnX(sideWin[0], sideWin[1]);
  poly([[-T, D, 0], [0, D, 0], [0, D, H], [-T, D, H]], { fill: COL.wallEnd, stroke: COL.edge });
  poly([[-T, -T, H], [0, -T, H], [0, D, H], [-T, D, H]], { fill: COL.wallTop, stroke: COL.edge });

  /*    뒷벽: y=0(우) — 주 창 */
  const backRings = [rectY(0, W, 0, H, 0)];
  const winSpans = [], balDoors = [];
  if (hasWin) rooms.forEach(r => {
    const a = r.ox + (r.ox === 0 && sideWin ? 0.05 : 0.2);
    let b = r.ox + r.w - 0.2;
    if (st.balcony) {
      balDoors.push([b - 0.9, b]);
      backRings.push(rectY(b - 0.9, b, 0, 2.2, 0));
      b -= 1.1;
    }
    winSpans.push([a, b]);
    backRings.push(rectY(a, b, win.sill, win.head, 0));
  });
  path(backRings, { fill: COL.wallY, stroke: COL.edge });
  winSpans.forEach(([a, b]) => windowOnY(a, b));
  balDoors.forEach(([a, b]) => {   // 발코니 출입 유리문
    poly(rectY(a, b, 0, 2.2, 0), { fill: COL.glass, op: 0.45, stroke: "#5f7582", sw: 2.2 });
    poly(rectY(a + 0.08, b - 0.08, 0.1, 2.12, 0.005), { fill: "none", stroke: "#8aa3b0", sw: 1 });
    line([[a + 0.14, 0.01, 0.95], [a + 0.14, 0.01, 1.2]], { stroke: "#5b6166", sw: 2.4 });
  });
  poly([[W, -T, 0], [W, 0, 0], [W, 0, H], [W, -T, H]], { fill: COL.wallEnd, stroke: COL.edge });
  poly([[-T, -T, H], [W, -T, H], [W, 0, H], [-T, 0, H]], { fill: COL.wallTop, stroke: COL.edge });

  /* 4. 호실별: 가벽 → 싱크대 → 출입문 */
  const doorW = st.clean ? (u.door || (u.drive ? 2.1 : 1.8)) : u.drive ? (u.door || 2.4) : 0.95;
  const doorH = st.clean ? (u.doorH || 2.1) : u.drive ? (u.doorH || 2.2) : 2.1;
  const doors = [];
  rooms.forEach((r, i) => {
    if (i > 0) {  // 가벽(터놓지 않음) — 반투명
      const x = r.ox;
      poly(rectX(0, D, 0, H, x + T / 2), { fill: "#ffffff", op: 0.42, stroke: "#7f7a72", sw: 1.4 });
      poly([[x - T / 2, 0, H], [x + T / 2, 0, H], [x + T / 2, D, H], [x - T / 2, D, H]], { fill: COL.wallTop, stroke: COL.edge });
      poly([[x - T / 2, D, 0], [x + T / 2, D, 0], [x + T / 2, D, H], [x - T / 2, D, H]], { fill: COL.wallEnd, op: 0.8, stroke: COL.edge });
    }
    if (st.sink && i === 0) sink(r.d, u.sinkLabel === "대리석");
    const xa = u.drive || st.clean ? r.ox + (r.w - doorW) / 2 : r.ox + r.w - 0.35 - doorW;
    const xb = xa + doorW;
    doors.push([xa, xb]);
    if (st.clean) {
      // 양개문은 전면벽 단계에서 그림
    } else if (!u.drive) {
      poly([[xb, r.d - doorW, 0], [xb, r.d, 0], [xb, r.d, doorH], [xb, r.d - doorW, doorH]], { fill: COL.leaf, op: 0.9, stroke: "#8e6c47", sw: 1.2 });
      const arc = [];
      for (let k = 0; k <= 16; k++) { const th = (Math.PI / 2) * k / 16; arc.push([xb - doorW * Math.cos(th), r.d - doorW * Math.sin(th), 0.003]); }
      line(arc, { stroke: COL.door, sw: 1.1, dash: "4 4" });
    } else {
      // 드라이브인 진입 화살표
      const cx = (xa + xb) / 2, y0 = r.d - 0.4, L = Math.min(2.2, r.d * 0.3), hw = 0.45;
      poly([[cx - hw * 0.45, y0, 0.004], [cx + hw * 0.45, y0, 0.004], [cx + hw * 0.45, y0 - L * 0.6, 0.004],
            [cx + hw, y0 - L * 0.6, 0.004], [cx, y0 - L, 0.004], [cx - hw, y0 - L * 0.6, 0.004], [cx - hw * 0.45, y0 - L * 0.6, 0.004]],
           { fill: "#a8752a", op: 0.55, stroke: "none" });
    }
  });

  function sink(d, marble) {
    const L = 1.6, y1 = d - 0.3, y0 = y1 - L;
    const cab = marble ? { fy: COL.cabinetSide, fx: COL.cabinet, top: COL.cabinet } : { fy: COL.cabinetSide, fx: COL.cabinet, top: COL.cabinet };
    poly(rectX(y0, y1, 0.86, 1.5, 0.004), { fill: marble ? "#e9e4dc" : "#dfe6e8", stroke: COL.edge, sw: 0.8 });
    box(0, 0.6, y0, y1, 0.1, 0.84, cab);
    box(0, 0.58, y0 + 0.03, y1 - 0.03, 0, 0.1, { fy: "#6b6f73", fx: "#6b6f73", top: "#6b6f73" });
    for (let k = 1; k < 3; k++) line([[0.6, y0 + L * k / 3, 0.14], [0.6, y0 + L * k / 3, 0.8]], { stroke: COL.edge, sw: 0.8 });
    for (let k = 0; k < 3; k++) line([[0.6, y0 + L * (k + 0.5) / 3 - 0.08, 0.72], [0.6, y0 + L * (k + 0.5) / 3 + 0.08, 0.72]], { stroke: "#6b6f73", sw: 2 });
    box(0, 0.64, y0 - 0.02, y1 + 0.02, 0.84, 0.88, marble
      ? { fy: COL.marble, fx: COL.marble, top: COL.marbleTop }
      : { fy: COL.counter, fx: COL.counter, top: COL.counterTop });
    poly([[0.12, y0 + 0.3, 0.881], [0.5, y0 + 0.3, 0.881], [0.5, y0 + 0.82, 0.881], [0.12, y0 + 0.82, 0.881]], { fill: COL.basin, stroke: "#6b7277", sw: 1 });
    line([[0.07, y0 + 0.56, 0.88], [0.07, y0 + 0.56, 1.14], [0.24, y0 + 0.56, 1.14], [0.24, y0 + 0.56, 1.08]], { stroke: "#5b6166", sw: 2.4 });
    box(0, 0.35, y0, y1, 1.55, 2.25, { fy: COL.cabinetSide, fx: COL.cabinet, top: COL.cabinetSide });
    for (let k = 1; k < 3; k++) line([[0.35, y0 + L * k / 3, 1.58], [0.35, y0 + L * k / 3, 2.22]], { stroke: COL.edge, sw: 0.8 });
  }

  /* 5. 전면 절단벽(문 개구부 제외) */
  const cutC = { fy: COL.cutFace, fx: COL.cutFace, top: COL.cut, edge: "#6b6760" };
  let x = -T;
  doors.slice().sort((a, b) => a[0] - b[0]).forEach(([xa, xb]) => {
    if (xa - x > 0.01) box(x, xa, D, D + T, 0, HC, cutC);
    x = xb;
  });
  if (W - x > 0.01) box(x, W, D, D + T, 0, HC, cutC);
  box(W, W + T, -T, D + T, 0, HC, cutC);

  /* 6. 문틀(점선) · 셔터 / 양개문 */
  if (st.clean) doors.forEach(([xa, xb]) => {
    const y = D + T / 2, c = (xa + xb) / 2;
    box(xa - 0.08, xb + 0.08, D, D + T, 0, doorH + 0.08, { fy: "#3f4650", fx: "#3f4650", top: "#2b3037", edge: "#2b3037" });
    [[xa, c], [c, xb]].forEach(([p, q]) => {
      poly([[p + 0.02, D + T + 0.002, 0.02], [q - 0.02, D + T + 0.002, 0.02], [q - 0.02, D + T + 0.002, doorH], [p + 0.02, D + T + 0.002, doorH]], { fill: "#7a838e", stroke: "#2b3037", sw: 1 });
      poly([[p + 0.2, D + T + 0.004, doorH * 0.55], [q - 0.2, D + T + 0.004, doorH * 0.55], [q - 0.2, D + T + 0.004, doorH - 0.2], [p + 0.2, D + T + 0.004, doorH - 0.2]], { fill: "#c3ccd4", stroke: "#2b3037", sw: 0.8 });
    });
    [c - 0.1, c + 0.1].forEach(hx => line([[hx, D + T + 0.006, 0.95], [hx, D + T + 0.006, 1.2]], { stroke: "#e2e6ea", sw: 2.4 }));
  });
  if (!st.clean) doors.forEach(([xa, xb]) => {
    line([[xa, D + T / 2, 0], [xa, D + T / 2, doorH], [xb, D + T / 2, doorH], [xb, D + T / 2, 0]], { stroke: COL.door, sw: 1.6, dash: "6 5" });
    if (u.drive) {
      box(xa - 0.05, xb + 0.05, D, D + T + 0.12, doorH, doorH + 0.3, { fy: "#c9ced2", fx: "#b5bbc0", top: "#dde1e4", edge: "#7c848a" });
      for (let z = doorH + 0.07; z < doorH + 0.3; z += 0.07) line([[xa - 0.05, D + T + 0.12, z], [xb + 0.05, D + T + 0.12, z]], { stroke: "#9aa1a7", sw: 0.8 });
    }
  });

  /* 7. 치수(실측값이 있을 때만) */
  const dimOps = [];
  const measured = !!(u.rooms && u.rooms.every(r => r.w));
  if (measured || st.clean) {   // 네이버 광고 정책: 이미지에는 가로·세로 숫자만(예: 4.3M)
    const DIM = st.clean ? "#e11d2a" : COL.dim, fs = st.clean ? 0.62 : 0.5, pre = measured || st.clean ? "" : "약 ";
    const fmt = v => measured ? v.toFixed(2) : (Math.round(v * 10) / 10).toFixed(1);
    const yd = D + T + 0.9;
    rooms.forEach(r => {
      dimOps.push({ t: "line", pts: [[r.ox, yd, 0], [r.ox + r.w, yd, 0]], stroke: DIM, sw: 2 });
      [r.ox, r.ox + r.w].forEach(xx => dimOps.push({ t: "line", pts: [[xx, D + T + 0.3, 0], [xx, yd + 0.25, 0]], stroke: DIM, sw: 1.2 }));
      dimOps.push({ t: "ftext", at: [r.ox + r.w / 2, yd + 0.65, 0], str: st.clean ? `${fmt(r.w)}M` : `${pre}${fmt(r.w)}m`, size: fs, fill: DIM, weight: 800 });
    });
    const xd = W + T + 0.9;
    dimOps.push({ t: "line", pts: [[xd, 0, 0], [xd, D, 0]], stroke: DIM, sw: 2 });
    [0, D].forEach(yy => dimOps.push({ t: "line", pts: [[W + T + 0.3, yy, 0], [xd + 0.25, yy, 0]], stroke: DIM, sw: 1.2 }));
    dimOps.push({ t: "ftextY", at: [xd + 0.35, D / 2, 0], str: st.clean ? `${fmt(D)}M` : `${pre}${fmt(D)}m`, size: fs, fill: DIM, weight: 800 });
    // 높이: 왼쪽 앞 모서리 바깥 (글씨 없는 이미지에는 생략)
    if (!st.clean) {
    const hp = [-T - 0.5, D + T + 0.5];
    dimOps.push({ t: "line", pts: [[hp[0], hp[1], 0], [hp[0], hp[1], H]], stroke: DIM, sw: 2 });
    [0, H].forEach(zz => dimOps.push({ t: "line", pts: [[hp[0] - 0.15, hp[1] + 0.15, zz], [hp[0] + 0.15, hp[1] - 0.15, zz]], stroke: DIM, sw: 2 }));
    dimOps.push({ t: "vtext", left: true, at: [hp[0], hp[1], H / 2], str: `높이 ${u.height ? "" : "약 "}${H.toFixed(1)}m`, fill: DIM });
    }
  }
  ops.push(...dimOps);

  /* 8. 방향 태그 */
  if (hasWin && u.dir) {
    const main = u.corner ? u.corner[0] + "향 창" : u.dir.replace(/향$/, "") + "향 창";
    tag([W / 2, -T, H + 0.25], main);
    if (u.corner) tag([-T, (sideWin[0] + sideWin[1]) / 2, H + 0.25], u.corner[1] + "향 창");
  }
  if (u.drive) {
    const [xa, xb] = doors[doors.length - 1];
    tag([(xa + xb) / 2, D + T, doorH + 0.9], "드라이브인 출입문");
  }

  /* ── 화면 좌표 맞춤 ── */
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  ops.forEach(o => {
    const pts = o.pts || (o.rings ? o.rings.flat() : [o.at]);
    pts.forEach(p => { const [sx, sy] = proj(p); minX = Math.min(minX, sx); maxX = Math.max(maxX, sx); minY = Math.min(minY, sy); maxY = Math.max(maxY, sy); });
  });
  const padX = 80, padTop = 70, padBot = 40;
  const k = Math.min((VW - 2 * padX) / (maxX - minX), (VH - padTop - padBot) / (maxY - minY));
  const offX = (VW - (maxX - minX) * k) / 2 - minX * k;
  const offY = padTop + ((VH - padTop - padBot) - (maxY - minY) * k) / 2 - minY * k;
  const S = p => { const [sx, sy] = proj(p); return [+(sx * k + offX).toFixed(1), +(sy * k + offY).toFixed(1)]; };
  const pts = arr => arr.map(p => S(p).join(",")).join(" ");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const sty = o => {
    const f = o.fill ? `fill="${o.fill}"` : `fill="none"`;
    const s = o.stroke === "none" ? `stroke="none"` : `stroke="${o.stroke || COL.edge}" stroke-width="${o.sw || 1}"`;
    return `${f} ${s}${o.op != null ? ` fill-opacity="${o.op}"` : ""}${o.dash ? ` stroke-dasharray="${o.dash}"` : ""} stroke-linejoin="round"`;
  };

  const out = [];
  ops.forEach(o => {
    if (o.t === "poly") out.push(`<polygon points="${pts(o.pts)}" ${sty(o)}/>`);
    else if (o.t === "path") out.push(`<path fill-rule="evenodd" d="${o.rings.map(r => "M" + r.map(p => S(p).join(",")).join("L") + "Z").join("")}" ${sty(o)}/>`);
    else if (o.t === "line") out.push(`<polyline points="${pts(o.pts)}" fill="none" stroke="${o.stroke}" stroke-width="${o.sw || 1}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ""} stroke-linecap="round" stroke-linejoin="round"/>`);
    else if (o.t === "ftext" || o.t === "ftextY") {
      const [ex, ey] = S(o.at);
      // 바닥 평면에 눕힌 글씨: ftext는 +x 방향, ftextY는 -y 방향으로 읽힘
      const m = o.t === "ftext" ? [C30, S30, -C30, S30] : [C30, -S30, C30, S30];
      const fs = o.size * k;
      out.push(`<text transform="matrix(${m.map(v => v.toFixed(4)).join(" ")} ${ex} ${ey})" font-size="${(fs / 1).toFixed(1)}" font-weight="${o.weight || 700}" fill="${o.fill}" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans KR, sans-serif">${esc(o.str)}</text>`);
    } else if (o.t === "vtext") {
      const [ex, ey] = S(o.at);
      out.push(`<text transform="translate(${o.left ? ex - 12 : ex + 26} ${ey}) rotate(-90)" font-size="22" font-weight="800" fill="${o.fill || COL.dim}" text-anchor="middle" font-family="Noto Sans KR, sans-serif">${esc(o.str)}</text>`);
    } else if (o.t === "tag") {
      const [ex, ey] = S(o.at);
      const w = o.str.length * 17 + 22;
      out.push(`<g><rect x="${ex - w / 2}" y="${ey - 34}" width="${w}" height="28" rx="14" fill="${COL.tagBg}"/><text x="${ex}" y="${ey - 19.5}" font-size="16" font-weight="700" fill="${COL.tagInk}" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans KR, sans-serif">${esc(o.str)}</text><line x1="${ex}" y1="${ey - 6}" x2="${ex}" y2="${ey + 4}" stroke="${COL.tagBg}" stroke-width="2"/></g>`);
    }
  });
  return `<svg class="drawing" viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc((u.title || u.id) + " 3D 개념도")}">${out.join("")}</svg>`;
}

/* ───────── 카드 ─────────
   PNG(.sheet)에는 도면과 치수만 — 호실명·층·동·면적 글씨는 넣지 않음.
   카드 위 캡션은 갤러리에서 구분용이며 내보내기 이미지에는 포함되지 않음. */
const state = {};
UNITS.forEach(u => { state[u.id] = { sink: !!u.sink, blind: !!u.blind, curtain: !!u.curtain }; });

function cardHTML(u) {
  const st = { ...state[u.id], clean: true, balcony: !u.id.startsWith("FB") && !u.terrace };
  const cap = [u.title || u.id, `${u.area}평`, u.dir].filter(Boolean).join(" · ");
  return `
    <article class="card" data-id="${u.id}" data-g="${u.id.startsWith("F") ? "F" : u.id.slice(0, 2)}">
      <div class="cap">${cap}</div>
      <div class="sheet" id="sheet-${u.id}">${renderUnit(u, st)}</div>
      <div class="toggles">
        <button type="button" data-t="sink" aria-pressed="${state[u.id].sink}">싱크대</button>
        <button type="button" data-t="blind" aria-pressed="${state[u.id].blind}">블라인드</button>
      </div>
    </article>`;
}

const grid = document.getElementById("grid");
function renderAll() {
  grid.innerHTML = UNITS.map(cardHTML).join("");
  applyFilter();
}
let filter = "all";
function applyFilter() {
  let n = 0;
  grid.querySelectorAll(".card").forEach(c => {
    const show = filter === "all" || c.dataset.g === filter;
    c.hidden = !show; if (show) n++;
  });
  document.getElementById("count").textContent = `${n}개 도면`;
}
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  applyFilter();
});
grid.addEventListener("click", e => {
  const b = e.target.closest(".toggles button"); if (!b) return;
  const card = b.closest(".card"); const id = card.dataset.id;
  const u = UNITS.find(x => x.id === id);
  state[id][b.dataset.t] = !state[id][b.dataset.t];
  // 사용자가 직접 켜고 끈 값은 확정값으로 표시
  u[b.dataset.t] = state[id][b.dataset.t];
  card.outerHTML = cardHTML(u);
  applyFilter();
});
if (/[?&]export\b/.test(location.search)) document.body.classList.add("export");
const sampleId = (location.search.match(/[?&]sample=([^&]+)/) || [])[1];
if (sampleId) {
  const u = UNITS.find(x => x.id === sampleId);
  document.body.classList.add("export");
  grid.innerHTML = `<div class="sheet clean" id="sheet-${u.id}-clean">${renderUnit(u, { ...state[u.id], clean: true, balcony: !u.id.startsWith("FB") && !u.terrace })}</div>`;
} else renderAll();
</script>
